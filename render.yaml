# Render Blueprint: bot + Mini App (one web service) and PostgreSQL, both in Frankfurt (EU).
# Render gives the service an https://<name>.onrender.com address — used automatically as the Mini App URL.
services:
  - type: web
    name: germany-assistant
    runtime: python
    region: frankfurt
    plan: free                # sleeps when idle; webhook mode wakes it on each Telegram message
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.main
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BOT_TOKEN
        sync: false            # entered in the Render dashboard, never committed
      - key: ADMIN_IDS
        sync: false
      - key: ANALYTICS_SALT
        generateValue: true
      - key: WEBHOOK_MODE
        value: "true"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: BOT_NAME
        value: Ukraine Helper DE
      - key: DATABASE_URL
        fromDatabase:
          name: germany-assistant-db
          property: connectionString

databases:
  - name: germany-assistant-db
    region: frankfurt
    plan: free                # free Render Postgres has a time limit; upgrade or move before it expires
