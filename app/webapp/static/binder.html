<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Germany Assistant</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Fonts are self-hosted (no requests to Google: DSGVO). IBM Plex Sans, SIL OFL — see /static/fonts/OFL.txt */
  @font-face { font-family: "Plex"; font-weight: 400; font-display: swap;
    src: url(/static/fonts/ibm-plex-sans-cyrillic-400-normal.woff2) format("woff2");
    unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: "Plex"; font-weight: 600; font-display: swap;
    src: url(/static/fonts/ibm-plex-sans-cyrillic-600-normal.woff2) format("woff2");
    unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: "Plex"; font-weight: 400; font-display: swap;
    src: url(/static/fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2");
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212; }
  @font-face { font-family: "Plex"; font-weight: 600; font-display: swap;
    src: url(/static/fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2");
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212; }
  @font-face { font-family: "Plex"; font-weight: 400; font-display: swap;
    src: url(/static/fonts/ibm-plex-sans-latin-ext-400-normal.woff2) format("woff2");
    unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+20A0-20AB,U+20AD-20C0; }
  @font-face { font-family: "Plex"; font-weight: 600; font-display: swap;
    src: url(/static/fonts/ibm-plex-sans-latin-ext-600-normal.woff2) format("woff2");
    unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+20A0-20AB,U+20AD-20C0; }

  /* Idea: the app is a paper binder (Ordner) with a spine label and numbered register tabs —
     the thing people actually carry to the Jobcenter and the Ausländerbehörde. */
  :root {
    --paper: #F3F5F2;
    --sheet: #FFFFFF;
    --form: #E4ECE3;
    --ink: #1B2638;
    --pencil: #5D6775;
    --rule: #D5DAD3;
    --cover: #23417A;
    --danger: #B42318;
    --t1: #F2C230; --t2: #8CC5E8; --t3: #9FCD92; --t4: #F2AFA6; --t5: #C9B9E8; --t6: #EBD39B;
    --tab-ink: #1B2638;
  }
  [data-theme="dark"] {
    --paper: #161B22; --sheet: #1E242D; --form: #232C27; --ink: #E9EDF2; --pencil: #9AA4B2;
    --rule: #2E3640; --cover: #2B4C8C; --danger: #F07167;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--paper); }
  body { margin: 0; font: 16px/1.5 "Plex", system-ui, sans-serif; color: var(--ink); background: var(--paper);
         padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--cover); outline-offset: 2px; }
  a { color: inherit; }

  /* Binder spine label */
  .spine { background: var(--cover); padding: 18px 16px 20px; display: flex; align-items: center; gap: 16px; }
  .label { flex: 1; background: #FFFFFF; color: #1B2638; border-radius: 3px; padding: 12px 14px 13px; }
  .label .owner { margin: 0; font-size: 13px; color: #5D6775; }
  .label h1 { margin: 2px 0 0; font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em; }
  .hole { width: 46px; height: 46px; border-radius: 50%; background: var(--paper); flex: none;
          box-shadow: inset 0 3px 6px rgba(0,0,0,.35); }

  main { max-width: 640px; margin: 0 auto; }
  .page { display: none; }
  .page.on { display: block; }

  /* Register: one sheet per section, numbered tab sticks out on the right */
  .register { list-style: none; margin: 18px 0 0; padding: 0 0 0 16px; }
  .register > li { margin-bottom: 6px; }
  .row { position: relative; }
  .sheet { display: block; width: calc(100% - 44px); text-align: left; background: var(--sheet); border: 0;
           border-radius: 4px 0 0 4px; padding: 14px 16px; cursor: pointer; box-shadow: 0 1px 0 var(--rule); }
  .sheet .t { display: block; font-weight: 600; font-size: 17px; }
  .sheet .s { display: block; font-size: 14px; color: var(--pencil); margin-top: 1px; }
  .tab { position: absolute; right: 0; top: 0; width: 44px; height: 100%; display: grid; place-items: start center;
         padding-top: 16px; background: var(--tab); color: var(--tab-ink); font-weight: 600; font-size: 15px;
         border-radius: 0 6px 6px 0; pointer-events: none; }
  .register > li.open .sheet { border-radius: 4px 0 0 0; }
  .body { display: none; width: calc(100% - 44px); background: var(--sheet); padding: 2px 16px 16px;
          border-top: 1px dashed var(--rule); border-radius: 0 0 0 4px; }
  .register > li.open .body { display: block; }
  .body p { margin: 10px 0 0; font-size: 15px; max-width: 60ch; }

  .links { list-style: none; margin: 4px 0 0; padding: 0; }
  .links li { border-bottom: 1px solid var(--rule); }
  .links li:last-child { border-bottom: 0; }
  .links a { display: block; padding: 11px 0; text-decoration: none; }
  .links .name { display: block; font-weight: 600; text-decoration: underline; text-decoration-color: var(--rule);
                 text-underline-offset: 3px; }
  .links .meta { display: block; font-size: 13px; color: var(--pencil); }

  .btn { display: inline-block; margin-top: 14px; padding: 11px 18px; border: 0; border-radius: 4px;
         background: var(--ink); color: var(--paper); font-weight: 600; cursor: pointer; }
  .btn.wide { width: 100%; margin-top: 20px; }
  .btn.danger { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 1.5px var(--danger); }

  .head { padding: 22px 16px 4px; }
  .head h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .head p { margin: 4px 0 0; color: var(--pencil); font-size: 15px; max-width: 60ch; }

  /* Profile looks like a German paper form */
  .form { margin: 14px 16px 0; background: var(--form); border-radius: 4px; padding: 6px 14px 16px; }
  .field { padding: 14px 0 0; }
  .field label { display: block; font-size: 13px; color: var(--pencil); }
  .field input, .field select { width: 100%; border: 0; border-bottom: 1.5px solid var(--ink); background-color: transparent;
           padding: 6px 0 5px; border-radius: 0; appearance: none; -webkit-appearance: none; font-size: 17px; }
  .field select { background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%),
                  linear-gradient(135deg, var(--ink) 50%, transparent 50%);
                  background-position: calc(100% - 10px) 55%, calc(100% - 5px) 55%;
                  background-size: 5px 5px; background-repeat: no-repeat; padding-right: 22px; }
  .check { display: flex; gap: 10px; align-items: flex-start; padding-top: 18px; font-size: 15px; }
  .check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ink); flex: none; }

  /* Reference catalogue */
  .topics { margin: 12px 16px 0; background: var(--sheet); border-radius: 4px; }
  .topics details { border-bottom: 1px solid var(--rule); }
  .topics details:last-child { border-bottom: 0; }
  .topics summary { list-style: none; padding: 14px; font-weight: 600; cursor: pointer; display: flex;
                    justify-content: space-between; gap: 12px; }
  .topics summary::-webkit-details-marker { display: none; }
  .topics summary::after { content: "+"; color: var(--pencil); font-weight: 400; }
  .topics details[open] summary::after { content: "−"; }
  .topics .links { padding: 0 14px 6px; }

  .plain { margin: 12px 16px 0; background: var(--sheet); border-radius: 4px; padding: 4px 14px 16px; }
  .plain p { max-width: 60ch; }
  .plain .quiet { color: var(--pencil); }

  nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--paper);
        border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; border: 0; background: none; padding: 16px 4px 15px; font-size: 14px; color: var(--pencil);
               cursor: pointer; position: relative; }
  nav button[aria-current="page"] { color: var(--ink); font-weight: 600; }
  nav button[aria-current="page"]::before { content: ""; position: absolute; left: 22%; right: 22%; top: -1px;
               height: 3px; background: var(--ink); }

  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom));
           background: var(--ink); color: var(--paper); padding: 12px 14px; border-radius: 4px; font-size: 15px;
           transform: translateY(8px); opacity: 0; transition: .18s ease-out; pointer-events: none; }
  .toast.show { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<header class="spine">
  <div class="label"><p class="owner" id="owner">Germany Assistant</p><h1 id="title"></h1></div>
  <div class="hole" aria-hidden="true"></div>
</header>

<main>
  <section class="page on" id="page-home"></section>
  <section class="page" id="page-profile"></section>
  <section class="page" id="page-info"></section>
  <section class="page" id="page-privacy"></section>
</main>

<nav id="nav"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
if (tg?.colorScheme === "dark") document.documentElement.dataset.theme = "dark";
try { tg?.setHeaderColor?.(getComputedStyle(document.documentElement).getPropertyValue("--cover").trim()); } catch {}

const I18N = {
  uk: {
    title: "Папка для життя в Німеччині",
    nav: { home: "Папка", profile: "Анкета", info: "Довідник", privacy: "Мої дані" },
    sections: [
      ["documents", "Документи", "Розбір німецьких листів. Готується"],
      ["jobs", "Робота", "Офіційні сайти з вакансіями"],
      ["housing", "Житло", "Офіційна інформація"],
      ["translator", "Перекладач", "Готується"],
      ["ai", "AI-помічник", "Готується"],
      ["info", "Довідник", "Anmeldung, Jobcenter, страхування та інше"],
    ],
    soon: {
      documents: "Ви зможете надіслати фото чи PDF листа в чат і отримати переклад, пояснення простими словами, строки й наступні кроки. Поки розділ готується, бот не дає вигаданих відповідей.",
      translator: "Переклад з німецької на українську і назад: з тексту, фото й голосових. Розділ готується.",
      ai: "Відповіді на питання про життя в Німеччині з посиланнями на офіційні джерела. Розділ готується, поки дивіться довідник.",
    },
    toChat: "Повернутися в чат",
    profileHead: "Анкета", profileNote: "Відповіді допомагають давати точніші підказки. Заповнюйте лише те, що хочете.",
    language: "Мова", land: "Федеральна земля", city: "Місто", level: "Рівень німецької", goal: "З чим потрібна допомога",
    status: "Статус перебування", broadcast: "Надсилати мені оголошення бота",
    save: "Зберегти анкету", saved: "Анкету збережено", notSet: "Не вказано", c1: "C1 і вище",
    goals: { documents: "Документи", jobs: "Робота", housing: "Житло", translation: "Переклад", other: "Інше" },
    statuses: { p24: "§24, тимчасовий захист", other: "Інший дозвіл" },
    infoHead: "Довідник", infoNote: "Лише офіційні сайти. Правила можуть відрізнятися в різних землях і містах, тож уточнюйте на місці.",
    checked: (d) => `посилання перевірено ${d}`,
    privacyHead: "Мої дані",
    privacyText: "Ми зберігаємо тільки анкету: мову, землю, місто, рівень німецької, мету і, якщо ви вказали, статус. Тексти листів і документів після обробки не зберігаються.",
    privacyWarn: "Ніколи не надсилайте боту паролі, PIN-коди чи дані банківських карток.",
    notLawyer: "Бот не є юристом чи державним органом і не гарантує результату.",
    del: "Видалити всі мої дані", delConfirm: "Видалити анкету і всі пов'язані записи назавжди?", deleted: "Дані видалено",
    openInTg: "Відкрийте цю сторінку через бота в Telegram, щоб заповнити анкету.",
    error: "Не вдалося зберегти. Перевірте інтернет і спробуйте ще раз.",
    loadError: "Не вдалося завантажити дані. Закрийте і відкрийте застосунок ще раз.",
  },
  ru: {
    title: "Папка для жизни в Германии",
    nav: { home: "Папка", profile: "Анкета", info: "Справочник", privacy: "Мои данные" },
    sections: [
      ["documents", "Документы", "Разбор немецких писем. Готовится"],
      ["jobs", "Работа", "Официальные сайты с вакансиями"],
      ["housing", "Жильё", "Официальная информация"],
      ["translator", "Переводчик", "Готовится"],
      ["ai", "AI-помощник", "Готовится"],
      ["info", "Справочник", "Anmeldung, Jobcenter, страховка и другое"],
    ],
    soon: {
      documents: "Вы сможете отправить фото или PDF письма в чат и получить перевод, объяснение простыми словами, сроки и следующие шаги. Пока раздел готовится, бот не даёт выдуманных ответов.",
      translator: "Перевод с немецкого на украинский и русский и обратно: из текста, фото и голосовых. Раздел готовится.",
      ai: "Ответы на вопросы о жизни в Германии со ссылками на официальные источники. Раздел готовится, пока смотрите справочник.",
    },
    toChat: "Вернуться в чат",
    profileHead: "Анкета", profileNote: "Ответы помогают давать более точные подсказки. Заполняйте только то, что хотите.",
    language: "Язык", land: "Федеральная земля", city: "Город", level: "Уровень немецкого", goal: "С чем нужна помощь",
    status: "Статус пребывания", broadcast: "Присылать мне объявления бота",
    save: "Сохранить анкету", saved: "Анкета сохранена", notSet: "Не указано", c1: "C1 и выше",
    goals: { documents: "Документы", jobs: "Работа", housing: "Жильё", translation: "Перевод", other: "Другое" },
    statuses: { p24: "§24, временная защита", other: "Другое разрешение" },
    infoHead: "Справочник", infoNote: "Только официальные сайты. Правила могут отличаться в разных землях и городах, поэтому уточняйте на месте.",
    checked: (d) => `ссылка проверена ${d}`,
    privacyHead: "Мои данные",
    privacyText: "Мы храним только анкету: язык, землю, город, уровень немецкого, цель и, если вы указали, статус. Тексты писем и документов после обработки не сохраняются.",
    privacyWarn: "Никогда не отправляйте боту пароли, PIN-коды и данные банковских карт.",
    notLawyer: "Бот не является юристом или государственным органом и не гарантирует результат.",
    del: "Удалить все мои данные", delConfirm: "Удалить анкету и все связанные записи навсегда?", deleted: "Данные удалены",
    openInTg: "Откройте эту страницу через бота в Telegram, чтобы заполнить анкету.",
    error: "Не удалось сохранить. Проверьте интернет и попробуйте ещё раз.",
    loadError: "Не удалось загрузить данные. Закройте и откройте приложение ещё раз.",
  },
};

let META = null, ME = null, SOURCES = [], lang = "uk";
const L = () => I18N[lang] || I18N.uk;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = (iso) => iso ? iso.split("-").reverse().join(".") : "";
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json",
    "X-Telegram-Init-Data": tg?.initData || "", ...(opts.headers || {}) } });
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

let toastTimer;
function toast(text) {
  const el = $("toast"); el.textContent = text; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

function show(page) {
  for (const p of ["home", "profile", "info", "privacy"]) $("page-" + p).classList.toggle("on", p === page);
  $("nav").querySelectorAll("button").forEach(b =>
    b.dataset.page === page ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  window.scrollTo(0, 0);
  tg?.HapticFeedback?.selectionChanged();
}

function renderNav() {
  $("nav").innerHTML = Object.entries(L().nav).map(([k, v]) => `<button data-page="${k}">${esc(v)}</button>`).join("");
  $("nav").querySelectorAll("button").forEach(b => b.onclick = () => show(b.dataset.page));
}

function linkList(topic) {
  const seen = new Set();
  return `<ul class="links">${SOURCES.filter(x => x.topic === topic && !seen.has(x.url) && seen.add(x.url)).map(x =>
    `<li><a href="${esc(x.url)}" data-ext><span class="name">${esc(lang === "ru" ? x.title_ru : x.title_uk)}</span>
     <span class="meta">${esc(host(x.url))}${x.checked_at ? ", " + esc(L().checked(fmtDate(x.checked_at))) : ""}</span></a></li>`
  ).join("")}</ul>`;
}

function sheetBody(k) {
  if (k === "jobs" || k === "housing") return linkList(k);
  if (L().soon[k]) return `<p>${esc(L().soon[k])}</p><button class="btn" data-chat>${esc(L().toChat)}</button>`;
  return "";
}

function renderHome() {
  $("page-home").innerHTML = `<ol class="register">${L().sections.map(([k, name, sub], i) => `
    <li data-k="${k}" style="--tab: var(--t${i + 1})">
      <div class="row"><button class="sheet" aria-expanded="false"><span class="t">${esc(name)}</span><span class="s">${esc(sub)}</span></button>
      <span class="tab" aria-hidden="true">${i + 1}</span></div>
      <div class="body">${sheetBody(k)}</div>
    </li>`).join("")}</ol>`;
  $("page-home").querySelectorAll(".register > li").forEach(li => {
    const btn = li.querySelector(".sheet");
    btn.onclick = () => {
      if (li.dataset.k === "info") return show("info");
      const open = !li.classList.contains("open");
      $("page-home").querySelectorAll(".register > li.open").forEach(o => {
        o.classList.remove("open"); o.querySelector(".sheet").setAttribute("aria-expanded", "false"); });
      li.classList.toggle("open", open); btn.setAttribute("aria-expanded", String(open));
      tg?.HapticFeedback?.selectionChanged();
    };
  });
  $("page-home").querySelectorAll("[data-chat]").forEach(b => b.onclick = () => tg?.close());
  bindLinks($("page-home"));
}

function bindLinks(root) {
  root.querySelectorAll("a[data-ext]").forEach(a => a.onclick = (e) => {
    if (tg?.openLink) { e.preventDefault(); tg.openLink(a.href); }
  });
}

function opts(list, current, labelFn, allowEmpty) {
  return (allowEmpty ? `<option value="">${esc(L().notSet)}</option>` : "") +
    list.map(v => `<option value="${esc(v)}" ${v === current ? "selected" : ""}>${esc(labelFn(v))}</option>`).join("");
}

function renderProfile() {
  const m = META, me = ME || {};
  if (!tg?.initData) {
    $("page-profile").innerHTML = `<div class="head"><h2>${esc(L().profileHead)}</h2><p>${esc(L().openInTg)}</p></div>`;
    return;
  }
  const field = (id, label, control) => `<div class="field"><label for="${id}">${esc(label)}</label>${control}</div>`;
  $("page-profile").innerHTML = `
    <div class="head"><h2>${esc(L().profileHead)}</h2><p>${esc(L().profileNote)}</p></div>
    <form class="form" id="pf">
      ${field("f-language", L().language, `<select id="f-language">${opts(m.languages, me.language || lang, v => ({uk: "Українська", ru: "Русский", de: "Deutsch"}[v] || v))}</select>`)}
      ${field("f-land", L().land, `<select id="f-land">${opts(Object.keys(m.lands), me.land, v => m.lands[v], true)}</select>`)}
      ${field("f-city", L().city, `<input id="f-city" maxlength="80" autocomplete="address-level2" value="${esc(me.city || "")}">`)}
      ${field("f-level", L().level, `<select id="f-level">${opts(m.levels, me.german_level, v => v === "C1" ? L().c1 : v, true)}</select>`)}
      ${field("f-goal", L().goal, `<select id="f-goal">${opts(m.goals, me.goal, v => L().goals[v], true)}</select>`)}
      ${field("f-status", L().status, `<select id="f-status">${opts(m.statuses, me.residence_status, v => L().statuses[v], true)}</select>`)}
      <label class="check"><input type="checkbox" id="f-broadcast" ${me.broadcast_consent ? "checked" : ""}> ${esc(L().broadcast)}</label>
      <button class="btn wide" type="submit">${esc(L().save)}</button>
    </form>`;
  $("pf").onsubmit = (e) => { e.preventDefault(); saveProfile(); };
}

async function saveProfile() {
  const v = (id) => $(id).value.trim() || null;
  const body = { language: v("f-language"), land: v("f-land"), city: v("f-city"), german_level: v("f-level"),
                 goal: v("f-goal"), residence_status: v("f-status"), broadcast_consent: $("f-broadcast").checked };
  try {
    await api("/api/me", { method: "PATCH", body: JSON.stringify(body) });
    ME = { ...ME, ...body };
    tg?.HapticFeedback?.notificationOccurred("success");
    if (body.language && body.language !== lang) { lang = body.language; renderAll("profile"); }
    toast(L().saved);
  } catch { toast(L().error); }
}

function renderInfo() {
  $("page-info").innerHTML = `<div class="head"><h2>${esc(L().infoHead)}</h2><p>${esc(L().infoNote)}</p></div>
    <div class="topics">${Object.entries(META.topics).map(([k, t]) =>
      `<details><summary>${esc(t[lang] || t.uk)}</summary>${linkList(k)}</details>`).join("")}</div>`;
  bindLinks($("page-info"));
}

function renderPrivacy() {
  $("page-privacy").innerHTML = `<div class="head"><h2>${esc(L().privacyHead)}</h2></div>
    <div class="plain"><p>${esc(L().privacyText)}</p><p><strong>${esc(L().privacyWarn)}</strong></p>
    <p class="quiet">${esc(L().notLawyer)}</p>
    ${tg?.initData ? `<button class="btn danger" id="del">${esc(L().del)}</button>` : ""}</div>`;
  const del = $("del"); if (!del) return;
  del.onclick = () => {
    const go = async (ok) => {
      if (!ok) return;
      try { await api("/api/me", { method: "DELETE" }); toast(L().deleted); setTimeout(() => tg?.close(), 1400); }
      catch { toast(L().error); }
    };
    tg?.showConfirm ? tg.showConfirm(L().delConfirm, go) : go(confirm(L().delConfirm));
  };
}

function renderAll(page = "home") {
  document.documentElement.lang = lang;
  $("owner").textContent = META.bot_name;
  $("title").textContent = L().title;
  renderNav(); renderHome(); renderProfile(); renderInfo(); renderPrivacy();
  show(page);
}

(async () => {
  try {
    [META, SOURCES] = await Promise.all([api("/api/meta"), api("/api/sources")]);
    lang = tg?.initDataUnsafe?.user?.language_code === "ru" ? "ru" : "uk";
    if (tg?.initData) { ME = await api("/api/me"); if (ME.language) lang = ME.language; }
    renderAll();
  } catch {
    document.querySelector("main").innerHTML = `<div class="head"><p>${esc(L().loadError)}</p></div>`;
  }
})();
</script>
</body>
</html>
