<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Germany Assistant</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Fonts are self-hosted (no requests to Google: DSGVO). IBM Plex Sans, SIL OFL — see /static/fonts/OFL.txt */
  @font-face { font-family: "Plex"; font-weight: 400; font-display: swap;
    src: url(/static/fonts/ibm-plex-sans-cyrillic-400-normal.woff2) format("woff2");
    unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: "Plex"; font-weight: 600; font-display: swap;
    src: url(/static/fonts/ibm-plex-sans-cyrillic-600-normal.woff2) format("woff2");
    unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: "Plex"; font-weight: 400; font-display: swap;
    src: url(/static/fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2");
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212; }
  @font-face { font-family: "Plex"; font-weight: 600; font-display: swap;
    src: url(/static/fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2");
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212; }
  @font-face { font-family: "Plex"; font-weight: 400; font-display: swap;
    src: url(/static/fonts/ibm-plex-sans-latin-ext-400-normal.woff2) format("woff2");
    unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+20A0-20AB,U+20AD-20C0; }
  @font-face { font-family: "Plex"; font-weight: 600; font-display: swap;
    src: url(/static/fonts/ibm-plex-sans-latin-ext-600-normal.woff2) format("woff2");
    unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+20A0-20AB,U+20AD-20C0; }

  /* Night platform. Header: the platform sign in the rain under a station lamp.
     Below: the platform itself — departures with platform numbers, enamel plates, lamp light for the main action.
     One look for Telegram's light and dark themes. Source of truth: docs/DESIGN_SYSTEM.md */
  :root {
    /* surfaces */
    --platform: #0E1729;          /* wet asphalt: page background */
    --sheet: #17305C;             /* enamel plate: panels */
    --board: #1F4285;             /* blue plate: price, info */
    --nav-bg: #0A1220;            /* platform edge */
    /* text */
    --ink: #F3F6FB;
    --pencil: #AEBBD0;
    --on-board: #FFFFFF;
    --on-board-dim: rgba(255,255,255,.74);
    /* lines */
    --rule: rgba(255,255,255,.14);
    --board-line: rgba(255,255,255,.12);
    --rim: rgba(255,255,255,.55);
    --field-line: rgba(255,255,255,.7);
    /* states */
    --signal: #FFC566;            /* lamp light: the main action */
    --on-signal: #13203A;         /* text on --signal */
    --danger: #FF8E80;
    --success: #7BD39A;
    --on-status: #0E1729;         /* text on --success / --danger */
    --tag-bg: rgba(255,255,255,.08);
    --field-bg: rgba(0,0,0,.15);
    /* effects */
    --shadow-panel: 0 6px 18px rgba(0,0,0,.25);
    --glow: 0 10px 40px rgba(255,197,102,.18);
    --lamp-reflection: rgba(255,197,102,.13);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--platform); }
  body { margin: 0; font: 16px/1.5 "Plex", system-ui, sans-serif; color: var(--ink); background: var(--platform);
         padding-bottom: calc(64px + env(safe-area-inset-bottom)); font-variant-numeric: tabular-nums; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  a { color: var(--ink); }

  /* Platform at night: rain, one warm station lamp and low fog. Static when reduced motion is on. */
  .sign { position: relative; overflow: hidden; color: var(--on-board); min-height: 148px; box-sizing: border-box;
          padding: 18px 16px 16px; border-bottom: 3px solid var(--on-board);
          background: linear-gradient(180deg, #0A1B3D 0%, #0F2C5E 62%, #163E80 100%); }
  .sign canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .sign .top { position: relative; padding-right: 96px; }
  .sign .owner { margin: 0; font-size: 13px; color: var(--on-board-dim); }
  .sign h1 { position: relative; margin: 34px 0 0; padding-right: 96px; font-size: 26px; line-height: 1.15; font-weight: 600;
             letter-spacing: -0.01em; text-shadow: 0 1px 12px rgba(10,27,61,.6); }
  .sign .clock { position: absolute; right: 22px; top: 84px; width: 56px; padding: 3px 0 2px; text-align: center;
                 background: #F4F1E8; color: #13203A; font-size: 15px; font-weight: 600; line-height: 1.2;
                 box-shadow: 0 0 0 2px #091327, 0 2px 8px rgba(0,0,0,.35); }

  /* ---- Page ---- */
  main { max-width: 640px; margin: 0 auto; min-height: calc(100vh - 151px);
         background: radial-gradient(ellipse 60% 220px at 88% 0, var(--lamp-reflection), transparent 70%),
                     linear-gradient(180deg, rgba(255,255,255,.025), transparent 260px); }
  .page { display: none; }
  .page.on { display: block; }
  .head { padding: 22px 16px 4px; }
  .head h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
  .head p { margin: 4px 0 0; color: var(--pencil); font-size: 15px; max-width: 60ch; }
  .sec { margin: 26px 16px 0; font-size: 21px; font-weight: 600; color: var(--ink); }
  .hint { font-size: 13px; color: var(--pencil); margin: 6px 0 0; max-width: 60ch; }

  /* ---- Departure board (home) ---- */
  .board-wrap { min-height: calc(100vh - 170px); padding: 16px 0 6px; }
  .board { list-style: none; margin: 0; padding: 0 0 6px; color: var(--on-board); }
  .board > li { border-bottom: 1px solid var(--board-line); }
  .board-label { margin: 18px 16px 2px; color: var(--pencil); font-size: 14px; }
  .dep { display: grid; grid-template-columns: 44px 1fr auto; gap: 0 14px; align-items: start; width: 100%;
         text-align: left; background: none; border: 0; padding: 14px 16px; cursor: pointer; }
  .gleis { grid-row: span 2; width: 36px; height: 36px; display: grid; place-items: center; border: 2px solid var(--on-board);
           border-radius: 4px; font-weight: 600; font-size: 17px; }
  .dest { font-weight: 600; font-size: 18px; line-height: 1.3; }
  .via { grid-column: 2 / 4; font-size: 14px; color: var(--on-board-dim); }
  .state { font-size: 14px; font-weight: 600; white-space: nowrap; padding-top: 3px; color: var(--on-board); }
  .state.wait { color: var(--signal); }
  .announce { display: none; margin: 0 16px 14px 74px; padding: 2px 0 2px 12px; border-left: 3px solid var(--signal); }
  .board > li.open .announce { display: block; }
  .announce p { margin: 0; font-size: 15px; max-width: 58ch; }
  .announce .links { margin-top: 0; }
  .announce .links li { border-color: var(--board-line); }
  .announce .links .name { text-decoration-color: var(--on-board-dim); }
  .announce .links .meta { color: var(--on-board-dim); }

  /* Main line: the lit poster under the lamp */
  .mainline { display: grid; grid-template-columns: 48px 1fr; gap: 2px 14px; width: calc(100% - 32px); margin: 0 16px 4px;
              padding: 18px 16px 16px; border: 0; border-radius: 8px; text-align: left; cursor: pointer;
              background: var(--signal); color: var(--on-signal); box-shadow: 0 0 0 1px rgba(255,197,102,.35), var(--glow); }
  .mainline .gleis { grid-row: span 4; width: 42px; height: 42px; border-color: var(--on-signal); border-radius: 6px; font-size: 20px; }
  .mainline:focus-visible { outline: 3px solid var(--on-board); outline-offset: 2px; }
  .m-dest { font-size: 26px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; }
  .m-via { font-size: 15px; }
  .m-count { font-size: 14px; font-weight: 600; }
  .m-cta { margin-top: 10px; justify-self: start; padding: 9px 14px; border-radius: 6px;
           background: var(--on-signal); color: var(--on-board); font-weight: 600; font-size: 15px; }

  /* ---- Links ---- */
  .links { list-style: none; margin: 4px 0 0; padding: 0; }
  .links li { border-bottom: 1px solid var(--rule); }
  .links li:last-child { border-bottom: 0; }
  .links a { display: block; padding: 10px 0; text-decoration: none; }
  .links .name { display: block; font-weight: 600; text-decoration: underline; text-decoration-color: var(--signal);
                 text-underline-offset: 3px; }
  .links .meta { display: block; font-size: 13px; color: var(--pencil); }

  /* ---- Buttons ---- */
  .btn { display: inline-block; margin-top: 12px; padding: 10px 16px; border: 0; border-radius: 6px;
         background: var(--signal); color: var(--on-signal); font-weight: 600; cursor: pointer; }
  .btn.wide { width: 100%; margin-top: 22px; }
  .btn.big { min-height: 48px; padding: 12px 20px; font-size: 17px; margin-top: 14px; }
  .btn.line { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--rim); }
  .btn.danger { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 2px var(--danger); }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .backlink { all: unset; cursor: pointer; display: inline-block; margin: 16px 16px 0; padding: 11px 0 9px; font-weight: 600;
              color: var(--signal); border-bottom: 2px solid var(--signal); }
  .emp-link { all: unset; cursor: pointer; display: block; margin: 28px 16px 8px; padding: 14px 0; color: var(--pencil);
              text-decoration: underline; text-underline-offset: 4px; font-size: 15px; }

  /* ---- Enamel plates (panels) ---- */
  .card, .form, .vac, .items, .topics, .plain, .empty, .price {
    background: var(--sheet); border-radius: 8px; box-shadow: inset 0 0 0 1.5px var(--rim), var(--shadow-panel); }
  .card { margin: 12px 16px 0; padding: 16px; }
  .card h2 { margin: 0; font-size: 21px; }
  .card h3 { margin: 0; font-size: 18px; line-height: 1.3; }
  .card p { margin: 8px 0 0; max-width: 60ch; }
  .card.profile.pending { box-shadow: inset 0 0 0 2px var(--signal), var(--shadow-panel); }
  .card.profile.approved { box-shadow: inset 0 0 0 2px var(--success), var(--shadow-panel); }
  .card.profile.rejected { box-shadow: inset 0 0 0 2px var(--danger), var(--shadow-panel); }
  .form { margin: 14px 16px 0; padding: 4px 14px 16px; }
  .plain { margin: 12px 16px 0; padding: 4px 14px 16px; }
  .plain p { max-width: 60ch; }
  .plain .quiet { color: var(--pencil); }
  .empty { margin: 12px 16px 0; padding: 16px 14px; color: var(--pencil); font-size: 15px; }
  .price { margin: 12px 16px 0; padding: 14px; background: var(--board); color: var(--on-board); }
  .price strong { font-size: 20px; display: block; }
  .price span { color: rgba(255,255,255,.8); font-size: 14px; }
  .items { margin: 12px 16px 0; }
  .item { border-bottom: 1px solid var(--rule); padding: 13px 14px; }
  .item:last-child { border-bottom: 0; }
  .item h3 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.3; }
  .item .meta { margin: 2px 0 0; font-size: 14px; color: var(--pencil); }
  .item .text { margin: 8px 0 0; font-size: 15px; white-space: pre-line; max-width: 60ch; }
  .item .more { display: none; }
  .item.open .more { display: block; }
  .item > button.toggle { all: unset; display: block; width: 100%; cursor: pointer; }
  .item > button.toggle:focus-visible { outline: 2px solid var(--signal); }
  .topics { margin: 12px 16px 0; }
  .topics details { border-bottom: 1px solid var(--rule); }
  .topics details:last-child { border-bottom: 0; }
  .topics summary { list-style: none; padding: 14px; font-weight: 600; cursor: pointer; display: flex;
                    justify-content: space-between; gap: 12px; }
  .topics summary::-webkit-details-marker { display: none; }
  .topics summary::after { content: "+"; color: var(--pencil); font-weight: 400; }
  .topics details[open] summary::after { content: "−"; }
  .topics .links { padding: 0 14px 6px; }

  /* ---- Badges and tags ---- */
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 7px; margin-top: 6px; border-radius: 4px;
           background: var(--signal); color: var(--on-signal); }
  .badge.ok { background: var(--success); color: var(--on-status); }
  .badge.no { background: var(--danger); color: var(--on-status); }
  .card .badge, .vac .badge { margin-top: 10px; }
  .done { font-weight: 600; color: var(--success); margin: 6px 0 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
  .tags span { font-size: 14px; padding: 4px 9px; border-radius: 4px; background: var(--tag-bg); color: var(--ink); }
  .tags .pay { background: var(--signal); color: var(--on-signal); font-weight: 600; }

  /* ---- Forms ---- */
  .field { padding: 14px 0 0; }
  .field label { display: block; font-size: 13px; color: var(--pencil); }
  .field input, .field select { width: 100%; min-height: 44px; border: 0; border-bottom: 1.5px solid var(--field-line);
           padding: 6px 0 5px; border-radius: 0; appearance: none; -webkit-appearance: none; font-size: 17px; color: var(--ink);
           background-color: transparent; }
  .field input::placeholder, .field textarea::placeholder { color: rgba(174,187,208,.75); }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--signal); }
  .field textarea { width: 100%; border: 1.5px solid var(--rim); border-radius: 6px; background: var(--field-bg); padding: 8px;
                    font: inherit; font-size: 16px; color: var(--ink); min-height: 96px; resize: vertical; }
  .field select, .filter select {
    background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: calc(100% - 10px) 55%, calc(100% - 5px) 55%; background-size: 5px 5px; background-repeat: no-repeat;
    padding-right: 22px; }
  /* Desktop Telegram draws native select popups: give selects and options explicit colours. */
  select { color-scheme: dark; background-color: var(--sheet) !important; color: var(--ink) !important; }
  select option, select optgroup { background-color: var(--sheet) !important; color: var(--ink) !important; }
  .filter { margin: 12px 16px 0; }
  .filter select { width: 100%; min-height: 44px; border: 0; border-bottom: 1.5px solid var(--field-line); border-radius: 0;
                   padding: 6px 22px 5px 0; appearance: none; -webkit-appearance: none; font-size: 16px;
                   background-color: var(--platform) !important; }
  .check { display: flex; gap: 10px; align-items: center; min-height: 44px; padding-top: 18px; font-size: 15px; }
  .check input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--signal); flex: none; }
  .pick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .pick button { min-height: 44px; padding: 8px 14px; border: 2px solid var(--rim); border-radius: 6px; background: transparent;
                 color: var(--ink); font-size: 16px; cursor: pointer; }
  .pick button[aria-checked="true"] { background: var(--signal); border-color: var(--signal); color: var(--on-signal); font-weight: 600; }
  .form.big { font-size: 17px; }
  .form.big .field input, .form.big .field select { font-size: 18px; padding: 8px 0 7px; }
  .form.big .field label, .form.big .lbl { font-size: 15px; color: var(--pencil); display: block; }

  /* ---- Tabs (housing) ---- */
  .seg { display: flex; gap: 6px; margin: 14px 16px 0; }
  .seg button { flex: 1; min-height: 44px; border: 0; border-radius: 6px; background: transparent; padding: 9px 4px;
                font-size: 13px; font-weight: 600; line-height: 1.25; color: var(--pencil); cursor: pointer;
                box-shadow: inset 0 0 0 1.5px var(--rule); }
  .seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: inset 0 0 0 2px var(--signal); }
  .jpanel { padding-bottom: 12px; }

  /* ---- Jobs window ---- */
  .jobs { font-size: 17px; padding-bottom: 8px; }
  .jobs .head h2 { font-size: 24px; }
  .jobs .filter select { font-size: 18px; padding: 8px 22px 7px 0; }
  .jobs .check { font-size: 17px; }
  .jobs .check input { width: 24px; height: 24px; }
  .invite-banner { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: calc(100% - 32px);
                   margin: 16px 16px 0; padding: 16px; border: 0; border-radius: 8px; background: var(--signal); color: var(--on-signal);
                   font-size: 17px; text-align: left; cursor: pointer; box-shadow: var(--glow); }
  .invite-banner span { padding: 8px 12px; border-radius: 6px; background: var(--on-signal); color: var(--on-board);
                        font-weight: 600; font-size: 15px; white-space: nowrap; }
  .vac { margin: 10px 16px 0; }
  .vac.open { box-shadow: inset 0 0 0 2px var(--signal), var(--shadow-panel); }
  .vac-head { all: unset; display: block; box-sizing: border-box; width: 100%; padding: 14px 16px; cursor: pointer; }
  .vac-head:focus-visible { outline: 2px solid var(--signal); }
  .vac-head h3 { margin: 0; font-size: 19px; line-height: 1.3; font-weight: 600; }
  .co { margin: 3px 0 0; color: var(--pencil); font-size: 15px; }
  .vac-body { padding: 0 16px 16px; }
  .vac-body .text, .card .text { white-space: pre-line; margin: 0 0 10px; }

  /* ---- Bottom bar: platform edge with the white safety line ---- */
  nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--nav-bg);
        padding-bottom: env(safe-area-inset-bottom); }
  nav::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
                background: repeating-linear-gradient(90deg, rgba(255,255,255,.85) 0 14px, transparent 14px 20px); }
  nav button { flex: 1; border: 0; background: none; padding: 16px 4px 15px; font-size: 14px; color: var(--pencil);
               cursor: pointer; position: relative; }
  nav button[aria-current="page"] { color: var(--signal); font-weight: 600; }
  nav button[aria-current="page"]::before { content: ""; position: absolute; left: 22%; right: 22%; top: 3px; height: 3px;
                                            background: var(--signal); }

  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom));
           padding: 12px 14px; border-radius: 6px; background: var(--signal); color: var(--on-signal); font-size: 15px;
           transform: translateY(8px); opacity: 0; transition: .18s ease-out; pointer-events: none; }
  .toast.show { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<header class="sign">
  <canvas id="rain" aria-hidden="true"></canvas>
  <div class="top"><p class="owner" id="owner">Germany Assistant</p></div>
  <span class="clock" id="clock" aria-hidden="true"></span>
  <h1 id="title"></h1>
</header>

<main>
  <section class="page on" id="page-home"></section>
  <section class="page" id="page-jobs"></section>
  <section class="page" id="page-housing"></section>
  <section class="page" id="page-profile"></section>
  <section class="page" id="page-info"></section>
  <section class="page" id="page-privacy"></section>
</main>

<nav id="nav"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
if (tg?.colorScheme === "dark") document.documentElement.dataset.theme = "dark";
const cssVar = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
try { tg?.setHeaderColor?.("#0A1B3D"); tg?.setBackgroundColor?.(cssVar("--platform")); tg?.setBottomBarColor?.(cssVar("--nav-bg")); } catch {}

// Station clock (Berlin time)
function tick() {
  const t = new Intl.DateTimeFormat("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" }).format(new Date());
  document.getElementById("clock").textContent = t;
}
tick(); setInterval(tick, 15000);

// Night platform: rain, a warm station lamp with a light cone, low drifting fog.
// One static frame when the user prefers reduced motion; paused while the page is hidden.
(function scene() {
  const c = document.getElementById("rain");
  if (!c) return;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ctx = c.getContext("2d"), dpr = Math.min(devicePixelRatio || 1, 2);
  const LIGHT = "255,198,112";
  let w, h, drops = [], fog = [], lamp;
  const train = { x: 0, on: false, next: performance.now() + 4000 };
  function size() {
    w = c.clientWidth; h = c.clientHeight; c.width = w * dpr; c.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const px = w - 50;                                   // post
    lamp = { px, top: 16, hx: px - 30, hy: 34 };          // lantern hangs from an arm
    drops = Array.from({ length: Math.round(w / 6) }, () => ({ x: Math.random() * w, y: Math.random() * h,
      l: 7 + Math.random() * 12, v: 4 + Math.random() * 4, a: .08 + Math.random() * .16 }));
    fog = Array.from({ length: 4 }, (_, i) => ({ x: Math.random() * w, y: h - 10 - Math.random() * 34,
      rx: 120 + Math.random() * 110, ry: 22 + Math.random() * 14, v: .12 + Math.random() * .18, a: .10 + i * .025 }));
  }
  function inCone(x, y) {
    if (y < lamp.hy + 10) return 0;
    const half = 8 + (y - lamp.hy) * .55, d = Math.abs(x - lamp.hx);
    return d < half ? 1 - d / half : 0;
  }
  function drawLamp() {
    const { px, top, hx, hy } = lamp;
    // glow and cone
    let g = ctx.createRadialGradient(hx, hy + 8, 2, hx, hy + 8, 120);
    g.addColorStop(0, `rgba(${LIGHT},.45)`); g.addColorStop(.35, `rgba(${LIGHT},.12)`); g.addColorStop(1, `rgba(${LIGHT},0)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.beginPath(); ctx.moveTo(hx - 7, hy + 12); ctx.lineTo(hx + 7, hy + 12);
    ctx.lineTo(hx + 8 + (h - hy) * .55, h); ctx.lineTo(hx - 8 - (h - hy) * .55, h); ctx.closePath();
    g = ctx.createLinearGradient(0, hy, 0, h);
    g.addColorStop(0, `rgba(${LIGHT},.20)`); g.addColorStop(1, `rgba(${LIGHT},.04)`);
    ctx.fillStyle = g; ctx.fill();
    // post, arm, lantern
    ctx.fillStyle = "#091327";
    ctx.fillRect(px - 2, top, 4, h - top);
    ctx.fillRect(px - 4, h - 8, 8, 8);
    ctx.strokeStyle = "#091327"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(px, top + 4); ctx.quadraticCurveTo(px - 14, top - 4, hx, top + 4); ctx.stroke();
    ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(hx, top + 4); ctx.lineTo(hx, hy - 6); ctx.stroke();
    ctx.fillStyle = "#091327";
    ctx.beginPath(); ctx.moveTo(hx - 11, hy - 1); ctx.lineTo(hx + 11, hy - 1); ctx.lineTo(hx + 5, hy - 7); ctx.lineTo(hx - 5, hy - 7); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.shadowColor = `rgba(${LIGHT},.95)`; ctx.shadowBlur = 18;
    ctx.fillStyle = "#FFE3B0";
    ctx.beginPath(); ctx.moveTo(hx - 9, hy - 1); ctx.lineTo(hx + 9, hy - 1); ctx.lineTo(hx + 6, hy + 11); ctx.lineTo(hx - 6, hy + 11); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle = "#091327"; ctx.fillRect(hx - 7, hy + 11, 14, 2);
  }
  // Distant regional train crossing the horizon now and then (generic, no operator branding).
  function drawTrain(ts) {
    if (still) return;
    if (!train.on && ts > train.next) { train.on = true; train.x = -260; }
    if (!train.on) return;
    const y = h - 34, len = 250, carH = 7;
    ctx.save(); ctx.globalAlpha = .55;
    ctx.fillStyle = "#DCE3EE"; ctx.fillRect(train.x, y, len, carH);
    ctx.beginPath(); ctx.moveTo(train.x + len, y); ctx.quadraticCurveTo(train.x + len + 14, y + 1, train.x + len + 16, y + carH);
    ctx.lineTo(train.x + len, y + carH); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#B8243A"; ctx.fillRect(train.x, y + carH - 2, len + 14, 1.5);
    ctx.fillStyle = "rgba(255,214,150,.95)";
    for (let i = 4; i < len - 4; i += 7) { if (i % 50 > 44) continue; ctx.fillRect(train.x + i, y + 1.5, 4, 2.5); }
    ctx.fillStyle = "#0A1B3D"; for (let i = 50; i < len; i += 50) ctx.fillRect(train.x + i - 1, y, 2, carH);
    ctx.restore();
    ctx.fillStyle = "rgba(255,255,255,.08)"; ctx.fillRect(0, y + carH + 1, w, 1);   // rails, barely visible
    train.x += 3.6;
    if (train.x > w + 20) { train.on = false; train.next = ts + 20000 + Math.random() * 25000; }
  }
  function drawBench() {
    const { px } = lamp, x0 = px - 64, x1 = px - 16, seat = h - 14;
    ctx.fillStyle = "#091327";
    ctx.fillRect(x0, seat, x1 - x0, 3);                 // seat
    ctx.fillRect(x0 + 1, seat - 10, x1 - x0 - 2, 2);     // backrest boards
    ctx.fillRect(x0 + 1, seat - 6, x1 - x0 - 2, 2);
    ctx.fillRect(x0 + 3, seat - 11, 2, 11); ctx.fillRect(x1 - 5, seat - 11, 2, 11);   // back posts
    ctx.fillRect(x0 + 3, seat + 3, 2, 11); ctx.fillRect(x1 - 5, seat + 3, 2, 11);     // legs
    ctx.fillStyle = "rgba(255,198,112,.35)"; ctx.fillRect(x0, seat, x1 - x0, 1);        // lamp light on the seat edge
  }
  function drawFog() {
    for (const f of fog) {
      ctx.save(); ctx.translate(f.x, f.y); ctx.scale(1, f.ry / f.rx);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, f.rx);
      g.addColorStop(0, `rgba(214,226,245,${f.a})`); g.addColorStop(1, "rgba(214,226,245,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, f.rx, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      if (!still) { f.x += f.v; if (f.x - f.rx > w) f.x = -f.rx; }
    }
  }
  function drawRain() {
    ctx.lineWidth = 1; ctx.lineCap = "round";
    for (const d of drops) {
      const k = inCone(d.x, d.y);
      ctx.strokeStyle = k ? `rgba(255,226,170,${Math.min(.85, d.a + k * .6)})` : `rgba(255,255,255,${d.a})`;
      ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.l * .18, d.y + d.l); ctx.stroke();
      if (!still) { d.y += d.v; d.x -= d.v * .18; if (d.y > h) { d.y = -d.l; d.x = Math.random() * (w + 20); } }
    }
  }
  function draw(ts = 0) { ctx.clearRect(0, 0, w, h); drawTrain(ts); drawLamp(); drawBench(); drawRain(); drawFog(); }
  size(); addEventListener("resize", () => { size(); draw(); });
  if (still) { draw(); return; }
  let last = 0;
  (function frame(ts) {
    requestAnimationFrame(frame);
    if (document.hidden || ts - last < 33) return; last = ts; draw(ts);
  })(0);
})();

let META = null, ME = null, SOURCES = [], lang = "uk";
const L = () => I18N[lang] || I18N.uk;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = (iso) => iso ? iso.split("-").reverse().join(".") : "";
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json",
    "X-Telegram-Init-Data": tg?.initData || "", ...(opts.headers || {}) } });
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

let toastTimer;
function toast(text) {
  const el = $("toast"); el.textContent = text; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

function show(page) {
  for (const p of ["home", "jobs", "housing", "profile", "info", "privacy"]) $("page-" + p).classList.toggle("on", p === page);
  $("nav").querySelectorAll("button").forEach(b =>
    b.dataset.page === page ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  window.scrollTo(0, 0);
  tg?.HapticFeedback?.selectionChanged();
  CURRENT = page;
  if (tg?.BackButton) page === "home" ? tg.BackButton.hide() : tg.BackButton.show();
}
let CURRENT = "home";
tg?.BackButton?.onClick?.(() => { if (CURRENT === "jobs" && jobsBack()) return; show("home"); });

function renderNav() {
  $("nav").innerHTML = Object.entries(L().nav).map(([k, v]) => `<button data-page="${k}">${esc(v)}</button>`).join("");
  $("nav").querySelectorAll("button").forEach(b => b.onclick = () => {
    if (b.dataset.page === "jobs") { JOBS.sub = null; renderJobs(); }
    show(b.dataset.page);
  });
}

function linkList(topic) {
  const seen = new Set();
  return `<ul class="links">${SOURCES.filter(x => x.topic === topic && !seen.has(x.url) && seen.add(x.url)).map(x =>
    `<li><a href="${esc(x.url)}" data-ext><span class="name">${esc(lang === "ru" ? x.title_ru : x.title_uk)}</span>
     <span class="meta">${esc(host(x.url))}${x.checked_at ? ", " + esc(L().checked(fmtDate(x.checked_at))) : ""}</span></a></li>`
  ).join("")}</ul>`;
}

function sheetBody(k) {
  if (k === "jobs" || k === "housing") return linkList(k);
  if (L().soon[k]) return `<p>${esc(L().soon[k])}</p><button class="btn" data-chat>${esc(L().toChat)}</button>`;
  return "";
}

function renderHome() {
  const [main, ...rest] = L().sections;
  const nVac = JOBS?.vacancies?.length || 0;
  $("page-home").innerHTML = `<div class="board-wrap">
    <button class="mainline" data-k="${main[0]}">
      <span class="gleis" aria-hidden="true">1</span>
      <span class="m-dest">${esc(main[1])}</span>
      <span class="m-via">${esc(main[2])}</span>
      ${nVac ? `<span class="m-count">${esc(L().openVac(nVac))}</span>` : ""}
      <span class="m-cta">${esc(L().findJob)}</span>
    </button>
    <p class="board-label">${esc(L().help)}</p>
    <ol class="board">${rest.map(([k, name, via, ready], j) => { const i = j + 1; return `
    <li data-k="${k}">
      <button class="dep" aria-expanded="false">
        <span class="gleis" aria-hidden="true">${i + 1}</span>
        <span class="dest">${esc(name)}</span>

        <span class="via">${esc(via)}</span>
      </button>
      <div class="announce">${sheetBody(k)}</div>
    </li>`; }).join("")}</ol></div>`;
  $("page-home").querySelector(".mainline").onclick = () => show("jobs");
  $("page-home").querySelectorAll(".board > li").forEach(li => {
    const btn = li.querySelector(".dep");
    btn.onclick = () => {
      if (li.dataset.k === "info") return show("info");
      if (li.dataset.k === "housing") return show("housing");
      const open = !li.classList.contains("open");
      $("page-home").querySelectorAll(".board > li.open").forEach(o => {
        o.classList.remove("open"); o.querySelector(".dep").setAttribute("aria-expanded", "false"); });
      li.classList.toggle("open", open); btn.setAttribute("aria-expanded", String(open));
      tg?.HapticFeedback?.selectionChanged();
    };
  });
  $("page-home").querySelectorAll("[data-chat]").forEach(b => b.onclick = () => tg?.close());
  bindLinks($("page-home"));
}

function bindLinks(root) {
  root.querySelectorAll("a[data-ext]").forEach(a => a.onclick = (e) => {
    if (tg?.openLink) { e.preventDefault(); tg.openLink(a.href); }
  });
}

function opts(list, current, labelFn, allowEmpty) {
  return (allowEmpty ? `<option value="">${esc(L().notSet)}</option>` : "") +
    list.map(v => `<option value="${esc(v)}" ${v === current ? "selected" : ""}>${esc(labelFn(v))}</option>`).join("");
}

function renderProfile() {
  const m = META, me = ME || {};
  if (!tg?.initData) {
    $("page-profile").innerHTML = `<div class="head"><h2>${esc(L().profileHead)}</h2><p>${esc(L().openInTg)}</p></div>`;
    return;
  }
  const field = (id, label, control) => `<div class="field"><label for="${id}">${esc(label)}</label>${control}</div>`;
  $("page-profile").innerHTML = `
    <div class="head"><h2>${esc(L().profileHead)}</h2><p>${esc(L().profileNote)}</p></div>
    <form class="form" id="pf">
      ${field("f-language", L().language, `<select id="f-language">${opts(m.languages, me.language || lang, v => ({uk: "Українська", ru: "Русский", de: "Deutsch"}[v] || v))}</select>`)}
      ${field("f-land", L().land, `<select id="f-land">${opts(Object.keys(m.lands), me.land, v => m.lands[v], true)}</select>`)}
      ${field("f-city", L().city, `<input id="f-city" maxlength="80" autocomplete="address-level2" value="${esc(me.city || "")}">`)}
      ${field("f-level", L().level, `<select id="f-level">${opts(m.levels, me.german_level, v => v === "C1" ? L().c1 : v, true)}</select>`)}
      ${field("f-goal", L().goal, `<select id="f-goal">${opts(m.goals, me.goal, v => L().goals[v], true)}</select>`)}
      ${field("f-status", L().status, `<select id="f-status">${opts(m.statuses, me.residence_status, v => L().statuses[v], true)}</select>`)}
      <label class="check"><input type="checkbox" id="f-broadcast" ${me.broadcast_consent ? "checked" : ""}> ${esc(L().broadcast)}</label>
      <button class="btn wide" type="submit">${esc(L().save)}</button>
    </form>`;
  $("pf").onsubmit = (e) => { e.preventDefault(); saveProfile(); };
}

async function saveProfile() {
  const v = (id) => $(id).value.trim() || null;
  const body = { language: v("f-language"), land: v("f-land"), city: v("f-city"), german_level: v("f-level"),
                 goal: v("f-goal"), residence_status: v("f-status"), broadcast_consent: $("f-broadcast").checked };
  try {
    await api("/api/me", { method: "PATCH", body: JSON.stringify(body) });
    ME = { ...ME, ...body };
    tg?.HapticFeedback?.notificationOccurred("success");
    if (body.language && body.language !== lang) { lang = body.language; renderAll("profile"); }
    toast(L().saved);
  } catch { toast(L().error); }
}

function renderInfo() {
  $("page-info").innerHTML = `<div class="head"><h2>${esc(L().infoHead)}</h2><p>${esc(L().infoNote)}</p></div>
    <div class="topics">${Object.entries(META.topics).map(([k, t]) =>
      `<details><summary>${esc(t[lang] || t.uk)}</summary>${linkList(k)}</details>`).join("")}</div>`;
  bindLinks($("page-info"));
}

function renderPrivacy() {
  $("page-privacy").innerHTML = `<div class="head"><h2>${esc(L().privacyHead)}</h2></div>
    <div class="plain"><p>${esc(L().privacyText)}</p><p><strong>${esc(L().privacyWarn)}</strong></p>
    <p class="quiet">${esc(L().notLawyer)}</p>
    ${tg?.initData ? `<button class="btn danger" id="del">${esc(L().del)}</button>` : ""}</div>`;
  const del = $("del"); if (!del) return;
  del.onclick = () => {
    const go = async (ok) => {
      if (!ok) return;
      try { await api("/api/me", { method: "DELETE" }); toast(L().deleted); setTimeout(() => tg?.close(), 1400); }
      catch { toast(L().error); }
    };
    tg?.showConfirm ? tg.showConfirm(L().delConfirm, go) : go(confirm(L().delConfirm));
  };
}

const JL = () => J[lang] || J.uk;
let JOBS = { me: null, view: "seeker", sub: null, land: null, vacancies: [], seekers: [], openVac: null, applyFor: null };

async function japi(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json",
    "X-Telegram-Init-Data": tg?.initData || "", ...(opts.headers || {}) } });
  let data = null; try { data = await res.json(); } catch {}
  if (!res.ok) { const e = new Error(res.status); e.code = res.status === 422 ? "invalid" : (data && data.detail); throw e; }
  return data;
}
const jerr = (e) => {
  const m = /^submit_limit:(\d+)$/.exec(e.code || "");
  toast(m ? JL().errors.submit_limit(m[1]) : (JL().errors[e.code] || JL().errors.other));
};
const badge = (st) => `<span class="badge ${["approved", "accepted", "sent"].includes(st) ? "ok" : ["rejected", "declined", "closed"].includes(st) ? "no" : ""}">${esc(JL().status[st] || st)}</span>`;
const landName = (c) => c ? (META.lands[c] || c) : "";
const where = (o) => [o.city, landName(o.land)].filter((x, i, arr) => x && arr.indexOf(x) === i).join(", ");
const field = (id, label, control, hint = "") => `<div class="field"><label for="${id}">${esc(label)}</label>${control}${hint ? `<p class="hint">${esc(hint)}</p>` : ""}</div>`;
const chips = (name, list, current, labelFn) => `<div class="pick" role="radiogroup" data-name="${name}">${list.map(v =>
  `<button type="button" role="radio" aria-checked="${v === current}" data-v="${esc(v)}">${esc(labelFn(v))}</button>`).join("")}</div>`;
const pickVal = (root, name) => root.querySelector(`.pick[data-name="${name}"] [aria-checked="true"]`)?.dataset.v || null;
function bindPicks(root) {
  root.querySelectorAll(".pick").forEach(g => g.querySelectorAll("button").forEach(b => b.onclick = () => {
    g.querySelectorAll("button").forEach(x => x.setAttribute("aria-checked", String(x === b)));
    tg?.HapticFeedback?.selectionChanged();
  }));
}

async function loadJobs() {
  if (!tg?.initData) return;
  JOBS.land = JOBS.land ?? (ME?.land || "");
  try {
    const q = JOBS.land ? `?land=${encodeURIComponent(JOBS.land)}` : "";
    [JOBS.me, JOBS.vacancies] = await Promise.all([japi("/api/jobs/me"), japi("/api/jobs/vacancies" + q)]);
    JOBS.seekers = JOBS.me.employer?.has_access ? await japi("/api/jobs/seekers" + q) : [];
    if (JOBS.me.employer && !JOBS.me.seeker && JOBS.view === "seeker" && !JOBS.sub) JOBS.view = "employer";
  } catch (e) { jerr(e); }
  renderJobs();
  if (!$("page-home").querySelector(".board > li.open")) renderHome();
}

function jobsBack() {
  if (JOBS.sub) { JOBS.sub = null; renderJobs(); window.scrollTo(0, 0); return true; }
  if (JOBS.view === "employer" && JOBS.me?.seeker) { JOBS.view = "seeker"; renderJobs(); return true; }
  return false;
}

function renderJobs() {
  const root = $("page-jobs"); if (!root) return;
  const T = JL();
  if (!tg?.initData) { root.innerHTML = `<div class="head"><h2>${esc(T.title)}</h2><p>${esc(L().openInTg)}</p></div>`; return; }
  if (!JOBS.me) { root.innerHTML = `<div class="head"><h2>${esc(T.title)}</h2></div>`; return; }
  const sub = JOBS.sub;
  const backBar = (sub || JOBS.view === "employer") ? `<button class="backlink" id="jback">${esc(T.back)}</button>` : "";
  root.innerHTML = `<div class="jobs">${backBar}<div id="jbody"></div></div>`;
  const back = $("jback"); if (back) back.onclick = () => { if (!jobsBack()) show("home"); };
  const body = $("jbody");
  if (sub === "form") return jSeekerForm(body);
  if (sub === "inbox") return jInbox(body);
  if (JOBS.view === "employer") return jEmployer(body);
  jSeekerHome(body);
}

function jSeekerHome(body) {
  const T = JL(), me = JOBS.me, p = me.seeker;
  const waiting = me.inbox.filter(c => c.kind === "offer" && c.status === "sent");
  const myApps = me.outbox.filter(c => c.kind === "apply");
  const appliedTo = new Set(myApps.filter(c => ["pending", "sent", "accepted"].includes(c.status)).map(c => c.vacancy_id));
  const profState = !p ? ["", T.profNone, T.profFill] : p.status === "pending" ? ["pending", T.profPending, T.edit]
    : p.status === "approved" ? ["approved", T.profApproved, T.edit] : ["rejected", T.profRejected, T.fix];
  const vacs = JOBS.vacancies.map(v => {
    const open = JOBS.openVac === v.id, applying = JOBS.applyFor === v.id;
    return `<article class="vac${open ? " open" : ""}">
      <button class="vac-head" data-vac="${v.id}" aria-expanded="${open}">
        <h3>${esc(v.title)}</h3><p class="co">${esc(v.company)}, ${esc(where(v))}</p>
        <p class="tags"><span>${esc(T.emp[v.employment])}</span><span>${esc(v.german_level ? T.germanFrom(v.german_level) : T.noGerman)}</span>${v.salary ? `<span class="pay">${esc(v.salary)}</span>` : ""}</p>
      </button>
      ${open ? `<div class="vac-body"><p class="text">${esc(v.description)}</p>
        ${appliedTo.has(v.id) ? `<p class="done">${esc(T.applied)}</p>`
          : p?.status !== "approved" ? `<p class="hint">${esc(T.needProfile)}</p><button class="btn big" data-go="form">${esc(T.profFill)}</button>`
          : applying ? `${field("am-" + v.id, T.applyLabel, `<textarea id="am-${v.id}" maxlength="600">${esc(T.applyText)}</textarea>`)}
              <button class="btn big" data-send="${v.id}">${esc(T.sendApply)}</button>`
          : `<button class="btn big" data-apply="${v.id}">${esc(T.apply)}</button>`}
      </div>` : ""}
    </article>`;
  }).join("");
  body.innerHTML = `
    ${waiting.length ? `<button class="invite-banner" data-go="inbox"><strong>${esc(T.invites(waiting.length))}</strong><span>${esc(T.look)}</span></button>` : ""}
    <section class="card profile ${profState[0]}">
      <h2>${esc(T.profTitle)}</h2>${p ? badge(p.status) : ""}
      <p>${esc(profState[1])}</p>
      ${p?.status === "approved" ? `<label class="check"><input type="checkbox" id="s-active" ${p.is_active ? "checked" : ""}> ${esc(T.visible)}</label>` : ""}
      <div class="row-btns"><button class="btn big ${p ? "line" : ""}" data-go="form">${esc(profState[2])}</button>
      ${(myApps.length || me.inbox.length) && !waiting.length ? `<button class="btn big line" data-go="inbox">${esc(T.inboxTitle)}</button>` : ""}</div>
    </section>
    <h2 class="sec">${esc(T.vacTitle)}</h2>
    <div class="filter"><select id="jland" aria-label="${esc(T.land)}"><option value="">${esc(T.allLands)}</option>${Object.keys(META.lands).map(c =>
      `<option value="${c}" ${c === JOBS.land ? "selected" : ""}>${esc(META.lands[c])}</option>`).join("")}</select></div>
    ${vacs || `<div class="card"><p>${esc(T.noVac)}</p>${linkList("jobs")}</div>`}
    <button class="emp-link" id="to-emp">${esc(T.employerLink)}</button>`;
  body.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { JOBS.sub = b.dataset.go; renderJobs(); window.scrollTo(0, 0); });
  body.querySelector("#jland").onchange = (e) => { JOBS.land = e.target.value; loadJobs(); };
  body.querySelector("#to-emp").onclick = () => { JOBS.view = "employer"; renderJobs(); window.scrollTo(0, 0); };
  body.querySelectorAll("[data-vac]").forEach(b => b.onclick = () => {
    const id = +b.dataset.vac; JOBS.openVac = JOBS.openVac === id ? null : id; JOBS.applyFor = null; renderJobs();
  });
  body.querySelectorAll("[data-apply]").forEach(b => b.onclick = () => { JOBS.applyFor = +b.dataset.apply; renderJobs(); });
  body.querySelectorAll("[data-send]").forEach(b => b.onclick = async () => {
    const id = +b.dataset.send; b.disabled = true;
    try { await japi("/api/jobs/applications", { method: "POST", body: JSON.stringify({ vacancy_id: id, message: $("am-" + id).value }) });
      toast(T.sentForReview); JOBS.applyFor = null; tg?.HapticFeedback?.notificationOccurred("success"); loadJobs(); }
    catch (e) { jerr(e); b.disabled = false; }
  });
  const act = body.querySelector("#s-active");
  if (act) act.onchange = async () => {
    try { await japi("/api/jobs/seeker/active", { method: "POST", body: JSON.stringify({ active: act.checked }) });
      toast(act.checked ? T.shown : T.hidden); } catch (e) { jerr(e); act.checked = !act.checked; }
  };
  bindLinks(body);
}

  const T = JL(), p = JOBS.me.seeker || { land: ME?.land, city: ME?.city, german_level: ME?.german_level, employment: "any" };
  const levels = META.levels;
  body.innerHTML = `<div class="head"><h2>${esc(T.formTitle)}</h2><p>${esc(T.formHint)}</p></div>
    <form class="form big" id="sf">
      ${field("s-position", T.position, `<input id="s-position" maxlength="120" required placeholder="${esc(T.positionPh)}" value="${esc(p.position || "")}">`)}
      <div class="field"><span class="lbl">${esc(T.employment)}</span>${chips("employment", META.employment, p.employment || "any", v => T.emp[v])}</div>
      <label class="check"><input type="checkbox" id="s-shifts" ${p.shifts_ok ? "checked" : ""}> ${esc(T.shiftsOk)}</label>
      ${field("s-land", T.land, `<select id="s-land">${opts(Object.keys(META.lands), p.land, v => META.lands[v], true)}</select>`)}

function jInbox(body) {

    </article>`;
  body.innerHTML = `${invites.length ? `<div class="head"><h2>${esc(T.inboxTitle)}</h2><p>${esc(T.inboxExplain)}</p></div>${invites.map(c => item(c, true)).join("")}` : ""}

      ${field("e-company", T.company, `<input id="e-company" maxlength="160" required value="${esc(x.company || "")}">`)}
      ${field("e-address", T.address, `<input id="e-address" maxlength="240" required value="${esc(x.address || "")}">`)}
      ${field("e-reg", T.register, `<input id="e-reg" maxlength="80" required value="${esc(x.register_no || "")}">`)}
      ${field("e-person", T.person, `<input id="e-person" maxlength="120" required value="${esc(x.contact_person || "")}">`)}
      ${field("e-contact", T.contact, `<input id="e-contact" maxlength="160" required value="${esc(x.contact || "")}">`)}

  } else if (!e.has_access) {
    body.innerHTML = head + `<div class="card"><p>${esc(T.empExpired(fmtDate(e.access_until)))}</p></div>`;
  } else {
    const openVacs = e.vacancies.filter(v => v.status === "approved");

        <button class="vac-head" data-cand="${s.id}"><h3>${esc(s.position)}</h3><p class="co">${esc(where(s))}</p>
          <p class="tags"><span>${esc(T.emp[s.employment])}</span><span>${esc(s.german_level ? T.germanFrom(s.german_level) : T.noGerman)}</span>${s.shifts_ok ? `<span>${esc(T.shifts)}</span>` : ""}</p></button>
        ${JOBS.openVac === -s.id ? `<div class="vac-body"><p class="text">${esc(T.expShort)}: ${esc(s.experience)}</p>${s.about ? `<p class="text">${esc(s.about)}</p>` : ""}

          ${field("om-" + s.id, T.inviteMsg, `<textarea id="om-${s.id}" maxlength="600"></textarea>`)}
          <button class="btn big" data-offer="${s.id}">${esc(T.invite)}</button></div>` : ""}</article>`).join("");
    const resp = responses.map(c => `<article class="card"><h3>${esc(c.seeker?.position || "")}</h3>
        <p class="co">${esc(c.vacancy ? T.onVac(c.vacancy) : "")}${c.seeker ? ", " + esc(where(c.seeker)) : ""}</p>
        ${c.seeker ? `<p class="text">${esc(T.expShort)}: ${esc(c.seeker.experience)}</p>` : ""}<p class="text">«${esc(c.message)}»</p>${badge(c.status)}
        ${c.status === "sent" ? `<div class="row-btns"><button class="btn big" data-ans="${c.id}:1">${esc(T.agree)}</button><button class="btn big line" data-ans="${c.id}:0">${esc(T.refuse)}</button></div>` : ""}</article>`).join("");
    const vacs = e.vacancies.map(v => `<article class="card"><h3>${esc(v.title)}</h3><p class="co">${esc(where(v))}</p>${badge(v.status)}
        ${["approved", "pending"].includes(v.status) ? `<div class="row-btns"><button class="btn line" data-close="${v.id}">${esc(T.close)}</button></div>` : ""}</article>`).join("");
    body.innerHTML = head + `<div class="price"><strong>${esc(e.company)}</strong><span>${esc(T.accessUntil(fmtDate(e.access_until)))}</span></div>
      ${resp ? `<h2 class="sec">${esc(T.empResponses)}</h2>${resp}` : ""}
      <h2 class="sec">${esc(T.candidates)}</h2>
      <div class="filter"><select id="jland"><option value="">${esc(T.allLands)}</option>${Object.keys(META.lands).map(c =>

      <h2 class="sec">${esc(T.newVac)}</h2>
      <form class="form big" id="vf">
        ${field("v-title", T.vTitle, `<input id="v-title" maxlength="120" required>`)}
        ${field("v-land", T.land, `<select id="v-land">${opts(Object.keys(META.lands), JOBS.land || null, v => META.lands[v], true)}</select>`)}
        ${field("v-city", T.city, `<input id="v-city" maxlength="80" required>`)}
        <div class="field"><span class="lbl">${esc(T.level)}</span>${chips("vlevel", META.levels, null, v => v === "C1" ? L().c1 : v)}</div>
        <div class="field"><span class="lbl">${esc(T.employment)}</span>${chips("vemp", META.employment, "full", v => T.emp[v])}</div>

    });
    body.querySelectorAll("[data-ans]").forEach(b => b.onclick = async () => {
      const [id, ok] = b.dataset.ans.split(":");
      try { await japi(`/api/jobs/requests/${id}/answer`, { method: "POST", body: JSON.stringify({ accept: ok === "1" }) }); loadJobs(); } catch (er) { jerr(er); }
    });
    body.querySelectorAll("[data-offer]").forEach(b => b.onclick = async () => {
      const id = +b.dataset.offer, sel = $("ov-" + id);
      const data = { seeker_id: id, message: $("om-" + id).value, vacancy_id: sel && sel.value ? +sel.value : null };
      try { await japi("/api/jobs/offers", { method: "POST", body: JSON.stringify(data) }); toast(T.sentForReview); JOBS.openVac = null; loadJobs(); }
      catch (er) { jerr(er); }
    });
    body.querySelector("#vf").onsubmit = async (ev) => {
      ev.preventDefault();
      const v = (id) => $(id).value.trim() || null;

      try { await japi("/api/jobs/vacancies", { method: "POST", body: JSON.stringify(data) }); toast(T.sentForReview); loadJobs(); }
      catch (er) { jerr(er); }
    };
    return;
  }
  const ef = body.querySelector("#ef");
  if (ef) ef.onsubmit = async (ev) => {
    ev.preventDefault();
    const v = (id) => $(id).value.trim() || null;
    const data = { company: v("e-company"), address: v("e-address"), register_no: v("e-reg"),
      contact_person: v("e-person"), contact: v("e-contact"), website: v("e-web") };
    try { await japi("/api/jobs/employer", { method: "PUT", body: JSON.stringify(data) }); toast(T.sentForReview); loadJobs(); }
    catch (er) { jerr(er); }
  };
}

let HOUSING = { data: null, tab: "terms" };

async function loadHousing() {
  try { HOUSING.data = await api("/api/housing"); } catch {}
  renderHousing();
}

function renderHousing() {
  const root = $("page-housing"); if (!root) return;
  const T = HL();
  root.innerHTML = `<div class="head"><h2>${esc(T.title)}</h2></div>
    <div class="seg">${Object.entries(T.tabs).map(([k, v]) => `<button data-t="${k}" aria-pressed="${HOUSING.tab === k}">${esc(v)}</button>`).join("")}</div>
    <div class="jpanel" id="hpanel"></div>`;
  root.querySelectorAll(".seg button").forEach(b => b.onclick = () => { HOUSING.tab = b.dataset.t; renderHousing(); });
  if (!HOUSING.data) return;
  ({ terms: hTerms, docs: hDocs, calc: hCalc, letter: hLetter })[HOUSING.tab]($("hpanel"));
}

function hSources() {
  const d = HOUSING.data;
  return `<div class="items"><div class="item"><p class="meta">${esc(HL().checked(fmtDate(d.checked)))}</p>
    <ul class="links">${d.sources.map(s => `<li><a href="${esc(s.url)}" data-ext><span class="name">${esc(s.title)}</span><span class="meta">${esc(host(s.url))}</span></a></li>`).join("")}</ul></div></div>`;
}

function hTerms(panel) {
  panel.innerHTML = `<div class="items">${HOUSING.data.terms.map(x =>
    `<div class="item"><h3>${esc(x.de)}</h3><p class="text">${esc(x[lang] || x.uk)}</p></div>`).join("")}</div>` + hSources();
  bindLinks(panel);
}

function hDocs(panel) {
  const d = HOUSING.data;
  const li = (a) => a.map(x => `<div class="item"><p class="text" style="margin:0">${esc(x)}</p></div>`).join("");
  panel.innerHTML = `<div class="items">${li(d.checklist[lang] || d.checklist.uk)}</div>
    <div class="head"><p><strong>${esc(HL().safety)}</strong></p></div><div class="items">${li(d.safety[lang] || d.safety.uk)}</div>`;
}

function hCalc(panel) {
  const T = HL();
  const num = (id, label, val) => `<div class="field"><label for="${id}">${esc(label)}</label><input id="${id}" type="number" inputmode="decimal" min="0" step="1" value="${val}"></div>`;
  panel.innerHTML = `<div class="head"><p>${esc(T.calcIntro)}</p></div>
    <form class="form" id="hc" onsubmit="return false">
      ${num("c-kalt", T.kalt, 500)}${num("c-neben", T.neben, 150)}
      <div class="field"><label for="c-km">${esc(T.kMonths)}</label><select id="c-km">${[3, 2, 1, 0].map(m => `<option value="${m}">${m}</option>`).join("")}</select></div>
      <label class="check"><input type="checkbox" id="c-rates" checked> ${esc(T.rates)}</label>
      ${num("c-makler", T.makler, 0)}${num("c-other", T.other, 300)}
    </form>
    <div class="items" id="c-out"></div><p class="hint" style="margin:10px 16px">${esc(T.calcNote)}</p>`;
  const eur = (n) => new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n);
  const calc = () => {
    const v = (id) => Math.max(0, parseFloat($(id).value.replace(",", ".")) || 0);
    const kalt = v("c-kalt"), warm = kalt + v("c-neben"), kaution = kalt * Math.min(3, +$("c-km").value);
    const rates = $("c-rates").checked, part = rates ? kaution / 3 : kaution;
    const atMove = warm + part + v("c-makler") + v("c-other");
    const m23 = warm + (rates ? kaution / 3 : 0);
    const row = (a, b, strong) => `<div class="item"><p class="meta" style="margin:0">${esc(a)}</p><h3>${strong ? `<strong>${esc(b)}</strong>` : esc(b)}</h3></div>`;
    $("c-out").innerHTML = row(T.warm, eur(warm)) + row(T.kaution, eur(kaution)) + row(T.atMove, eur(atMove), true) +
      row(T.m23, eur(m23)) + row(T.first3, eur(atMove + 2 * m23));
  };
  panel.querySelectorAll("input, select").forEach(i => i.oninput = calc);
  calc();
}

    ["Sehr geehrte Damen und Herren,", { uk: "Шановні пані та панове,", ru: "Уважаемые дамы и господа," }],
    [`mit großem Interesse habe ich Ihre Anzeige für die Wohnung ${f.object} gelesen und möchte mich hiermit um die Wohnung bewerben.`,
      { uk: `Я з цікавістю прочитав(ла) ваше оголошення про квартиру ${f.object} і хочу подати заявку.`, ru: `Я с интересом прочитал(а) ваше объявление о квартире ${f.object} и хочу подать заявку.` }],
    [`Mein Name ist ${f.name}. Ich komme aus der Ukraine${f.since ? ` und lebe seit ${f.since} in Deutschland` : ""}${f.city ? `, derzeit in ${f.city}` : ""}.`,
      { uk: `Мене звати ${f.name}. Я з України${f.since ? `, живу в Німеччині з ${f.since}` : ""}${f.city ? `, зараз у місті ${f.city}` : ""}.`,
        ru: `Меня зовут ${f.name}. Я из Украины${f.since ? `, живу в Германии с ${f.since}` : ""}${f.city ? `, сейчас в городе ${f.city}` : ""}.` }],
    household, ...(income ? [income] : []),
    ...(f.level ? [[`Ich spreche Deutsch auf dem Niveau ${f.level} und lerne weiter.`, { uk: `Я говорю німецькою на рівні ${f.level} і продовжую вчити.`, ru: `Я говорю по-немецки на уровне ${f.level} и продолжаю учить.` }]] : []),
    ...(f.moveIn ? [[`Ein Einzug wäre ab dem ${f.moveIn} möglich.`, { uk: `Можу заїхати з ${f.moveIn}.`, ru: `Могу въехать с ${f.moveIn}.` }]] : []),
    ["Alle nötigen Unterlagen sende ich Ihnen gerne zu. Über eine Einladung zur Besichtigung würde ich mich sehr freuen.",
      { uk: "Охоче надішлю всі потрібні документи. Буду радий(а) запрошенню на перегляд.", ru: "С радостью пришлю все нужные документы. Буду рад(а) приглашению на просмотр." }],
    [`Mit freundlichen Grüßen\n${f.name}${f.contact ? "\n" + f.contact : ""}`, { uk: `З повагою,\n${f.name}`, ru: `С уважением,\n${f.name}` }],
  ];
  return { de: lines.map(l => l[0]).join("\n\n"), tr: lines.map(l => l[1][lang] || l[1].uk).join("\n\n") };
}

function hLetter(panel) {
  const T = HL();
  const field = (id, label, control) => `<div class="field"><label for="${id}">${esc(label)}</label>${control}</div>`;
  const inp = (id, max, extra = "") => `<input id="${id}" maxlength="${max}" ${extra}>`;
  panel.innerHTML = `<div class="head"><p>${esc(T.letterIntro)}</p></div>
    <form class="form" id="hl">
      ${field("l-name", T.name, inp("l-name", 80, 'autocomplete="name"'))}
      ${field("l-object", T.object, inp("l-object", 120))}
      ${field("l-city", T.city, inp("l-city", 80, `value="${esc(ME?.city || "")}"`))}
      ${field("l-since", T.since, inp("l-since", 20))}
      ${field("l-adults", T.adults, `<select id="l-adults">${[1, 2, 3, 4, 5].map(n => `<option>${n}</option>`).join("")}</select>`)}
      ${field("l-kids", T.kids, `<select id="l-kids">${[0, 1, 2, 3, 4, 5].map(n => `<option>${n}</option>`).join("")}</select>`)}
      ${field("l-income", T.income, `<select id="l-income">${Object.entries(T.inc).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("")}</select>`)}
      ${field("l-job", T.jobTitle, inp("l-job", 60))}
      ${field("l-level", T.level, `<select id="l-level">${opts(META.levels, ME?.german_level, v => v === "C1" ? L().c1 : v, true)}</select>`)}
      ${field("l-move", T.moveIn, inp("l-move", 30))}
      ${field("l-contact", T.contact, inp("l-contact", 80))}
      <button class="btn wide" type="submit">${esc(T.make)}</button>
    </form><div id="l-out"></div>`;
  panel.querySelector("#hl").onsubmit = (e) => {
    e.preventDefault();
    const v = (id) => $(id).value.trim();
    const f = { name: v("l-name"), object: v("l-object"), city: v("l-city"), since: v("l-since"), adults: +v("l-adults"),
      kids: +v("l-kids"), income: v("l-income"), job: v("l-job"), level: v("l-level"), moveIn: v("l-move"), contact: v("l-contact") };
    if (!f.name || !f.object) return toast(T.needName);
    const out = buildLetter(f);
    $("l-out").innerHTML = `<div class="head"><p><strong>${esc(T.yourLetter)}</strong></p></div>
      <div class="items"><div class="item"><p class="text" id="l-de" style="margin:0">${esc(out.de)}</p>
      <button class="btn" id="l-copy">${esc(T.copy)}</button></div></div>
      <div class="head"><p>${esc(T.meaning)}</p></div><div class="items"><div class="item"><p class="text" style="margin:0">${esc(out.tr)}</p></div></div>`;
    $("l-copy").onclick = async () => {
      try { await navigator.clipboard.writeText(out.de); toast(T.copied); }
      catch { const r = document.createRange(); r.selectNodeContents($("l-de")); getSelection().removeAllRanges(); getSelection().addRange(r); }
    };
    $("l-out").scrollIntoView({ behavior: "smooth" });
  };
}

function renderAll(page = "home") {
  document.documentElement.lang = lang;
  $("owner").textContent = META.bot_name;
  $("title").textContent = L().title;
  renderNav(); renderHome(); renderJobs(); renderHousing(); renderProfile(); renderInfo(); renderPrivacy();
  show(page);
}

(async () => {
  try {
    [META, SOURCES] = await Promise.all([api("/api/meta"), api("/api/sources")]);
    lang = tg?.initDataUnsafe?.user?.language_code === "ru" ? "ru" : "uk";
    if (tg?.initData) { ME = await api("/api/me"); if (ME.language) lang = ME.language; }
    renderAll(location.hash === "#housing" ? "housing" : location.hash === "#jobs" ? "jobs" : "home");
    loadJobs(); loadHousing();
  } catch {
    document.querySelector("main").innerHTML = `<div class="head"><p>${esc(L().loadError)}</p></div>`;
  }
})();
</script>
