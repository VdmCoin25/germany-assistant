<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Germany Assistant</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  // Apply the saved palette and mode before the first paint (no flash of the default theme).
  try { var t = JSON.parse(localStorage.getItem("ui_theme_v1") || "{}"), d = document.documentElement;
        d.dataset.palette = t.palette || "emerald";
        d.dataset.mode = t.mode === "light" || t.mode === "dark" ? t.mode
          : (window.Telegram && Telegram.WebApp && Telegram.WebApp.colorScheme === "light" ? "light" : "dark"); } catch (e) {}
</script>
<style>
  /* Fonts are self-hosted (no requests to Google: DSGVO). IBM Plex Sans, SIL OFL — see /static/fonts/OFL.txt */
  @font-face { font-family: "Plex"; font-weight: 400; font-display: swap;
    src: url(/static/fonts/ibm-plex-sans-cyrillic-400-normal.woff2) format("woff2");
    unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: "Plex"; font-weight: 600; font-display: swap;
    src: url(/static/fonts/ibm-plex-sans-cyrillic-600-normal.woff2) format("woff2");
    unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: "Plex"; font-weight: 400; font-display: swap;
    src: url(/static/fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2");
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212; }
  @font-face { font-family: "Plex"; font-weight: 600; font-display: swap;
    src: url(/static/fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2");
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212; }
  @font-face { font-family: "Plex"; font-weight: 400; font-display: swap;
    src: url(/static/fonts/ibm-plex-sans-latin-ext-400-normal.woff2) format("woff2");
    unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+20A0-20AB,U+20AD-20C0; }
  @font-face { font-family: "Plex"; font-weight: 600; font-display: swap;
    src: url(/static/fonts/ibm-plex-sans-latin-ext-600-normal.woff2) format("woff2");
    unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+20A0-20AB,U+20AD-20C0; }

  /* Night platform. Header: the platform sign in the rain under a station lamp.
     Below: the platform itself — departures with platform numbers, enamel plates, lamp light for the main action.
     One look for Telegram's light and dark themes. Source of truth: docs/DESIGN_SYSTEM.md */
  /* ---- Themes: a colour palette × light or dark. The user picks both in Profile → Appearance. ----
     Each palette defines its own accents and the night sky of the header; the mode decides surfaces and text. */
  :root, [data-palette="emerald"] {
    --p-deep: #04201A; --p-tint: #E8F4EE; --p-accent: #3FE0A0; --p-accent-ink: #03281D; --p-accent-l: #0A7A50;
    --p-sky1: #031A14; --p-sky2: #07382B; --p-sky3: #0E5A44; --p-scene: #02140F;
  }
  [data-palette="sapphire"] {
    --p-deep: #0B1628; --p-tint: #EAF0FA; --p-accent: #7DB2FF; --p-accent-ink: #06204A; --p-accent-l: #1D57C2;
    --p-sky1: #0A1B3D; --p-sky2: #0F2C5E; --p-sky3: #163E80; --p-scene: #081430;
  }
  [data-palette="amethyst"] {
    --p-deep: #150F26; --p-tint: #F0ECFA; --p-accent: #BBA4FF; --p-accent-ink: #1E0F4A; --p-accent-l: #5E3DC4;
    --p-sky1: #140B2C; --p-sky2: #241650; --p-sky3: #3A2A78; --p-scene: #0C0720;
  }
  [data-palette="amber"] {
    --p-deep: #1E1608; --p-tint: #F7F1E6; --p-accent: #FFC566; --p-accent-ink: #3A2400; --p-accent-l: #8F5300;
    --p-sky1: #1E1404; --p-sky2: #3A270A; --p-sky3: #5C3F12; --p-scene: #140D02;
  }
  [data-palette="graphite"] {
    --p-deep: #111418; --p-tint: #EEF0F3; --p-accent: #D3DAE3; --p-accent-ink: #12171D; --p-accent-l: #374250;
    --p-sky1: #0D1014; --p-sky2: #1B2129; --p-sky3: #2C3440; --p-scene: #07090C;
  }
  :root {
    /* dark mode (default) */
    --platform: var(--p-deep);
    --sheet: color-mix(in srgb, var(--p-deep) 70%, var(--p-accent) 14%);
    --board: color-mix(in srgb, var(--p-deep) 55%, var(--p-accent) 30%);
    --nav-bg: color-mix(in srgb, var(--p-deep) 85%, #000);
    --ink: #F1F5F3;
    --pencil: color-mix(in srgb, #F1F5F3 66%, var(--p-accent) 10%);
    --on-board: #FFFFFF;
    --on-board-dim: rgba(255,255,255,.76);
    --rule: rgba(255,255,255,.12);
    --board-line: rgba(255,255,255,.10);
    --rim: rgba(255,255,255,.45);
    --field-line: rgba(255,255,255,.6);
    --signal: var(--p-accent);
    --on-signal: var(--p-accent-ink);
    --danger: #FF8E80;
    --success: #9BE7C4;
    --on-status: #10161A;
    --tag-bg: rgba(255,255,255,.08);
    --field-bg: rgba(255,255,255,.06);
    /* enamel plates: solid paint, a hairline edge, a darker lip at the bottom like a pressed metal sign */
    --plate: color-mix(in srgb, var(--p-deep) 82%, var(--p-accent) 8%);
    --plate-edge: rgba(255,255,255,.10);
    --lip: inset 0 -2px 0 rgba(0,0,0,.28);
    --accent-soft: color-mix(in srgb, var(--signal) 16%, transparent);
    /* the only translucent thing left: the bottom bar, so the platform shows through when scrolling */
    --bar: color-mix(in srgb, var(--p-deep) 78%, transparent);
    --radius: 6px;
    --radius-card: 8px;
    --radius-tag: 3px;
    --ease: cubic-bezier(.2,.7,.2,1);
    color-scheme: dark;
  }
  [data-mode="light"] {
    --platform: var(--p-tint);
    --sheet: #FFFFFF;
    --board: var(--p-accent-l);
    --nav-bg: color-mix(in srgb, var(--p-tint) 70%, #fff);
    --ink: #15201C;
    --pencil: #4C5A55;
    --rule: rgba(0,0,0,.09);
    --board-line: rgba(0,0,0,.08);
    --rim: rgba(0,0,0,.32);
    --field-line: rgba(0,0,0,.42);
    --signal: var(--p-accent-l);
    --on-signal: #FFFFFF;
    --danger: #B3261E;
    --success: #1B7A4B;
    --on-status: #FFFFFF;
    --tag-bg: rgba(0,0,0,.05);
    --field-bg: rgba(255,255,255,.7);
    --plate: #FFFFFF;
    --plate-edge: rgba(0,0,0,.10);
    --lip: inset 0 -2px 0 rgba(0,0,0,.20);
    --bar: color-mix(in srgb, var(--p-tint) 80%, transparent);
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--platform); }
  body { margin: 0; font: 17px/1.5 "Plex", system-ui, sans-serif; color: var(--ink); background: var(--platform);
         transition: background-color 300ms var(--ease), color 300ms var(--ease);
         padding-bottom: calc(64px + env(safe-area-inset-bottom)); font-variant-numeric: tabular-nums; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  a { color: var(--ink); }

  /* Platform at night: rain, one warm station lamp and low fog. Static when reduced motion is on. */
  .sign { position: relative; overflow: hidden; color: var(--on-board); min-height: 148px; box-sizing: border-box;
          padding: 18px 16px 16px; border-bottom: 3px solid var(--on-board);
          background: linear-gradient(180deg, var(--p-sky1) 0%, var(--p-sky2) 62%, var(--p-sky3) 100%); }
  .sign canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .sign .top { position: relative; padding-right: 110px; }   /* keeps clear of the lamp */
  .sign .owner, .sign .updated { margin: 0; font-size: 13px; color: var(--on-board-dim); font-variant-numeric: tabular-nums; }
  .sign .sub { position: relative; margin: 2px 0 0; padding-right: 110px; font-size: 15px; color: var(--on-board-dim); }
  .sign h1 { position: relative; margin: 26px 0 0; padding-right: 110px; font-size: 26px; line-height: 1.15; font-weight: 600;
             letter-spacing: -0.01em; }
  .sign .clock { display: inline-block; margin-left: 8px; padding: 0 5px; border-radius: 2px; vertical-align: 1px;
                 background: #F4F1E8; color: #13203A; font-size: 12px; font-weight: 600; line-height: 18px; }

  /* ---- Page ---- */
  main { max-width: 640px; margin: 0 auto; min-height: calc(var(--app-h, 100vh) - 151px); }
  .page { display: none; }
  .page.on { display: block; animation: page-in 140ms linear both; }
  @keyframes page-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .head { padding: 24px 16px 4px; }
  .head h2 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
  .head p { margin: 4px 0 0; color: var(--pencil); font-size: 15px; max-width: 60ch; }
  .sec { margin: 24px 16px 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
  .hint { font-size: 13px; color: var(--pencil); margin: 8px 0 0; max-width: 60ch; }

  /* ---- Departure board (home) ---- */
  .board-wrap { min-height: calc(var(--app-h, 100vh) - 170px); padding: 16px 0 8px; }
  .board { list-style: none; margin: 0 16px; padding: 0; color: var(--ink); border-radius: var(--radius-card); overflow: hidden;
           background: var(--plate); border: 1px solid var(--plate-edge); }
  .board.later { background: transparent; border-style: dashed; }
  .board.later .dest { font-weight: 400; }
  .board > li:last-child { border-bottom: 0; }
  .board > li { border-bottom: 1px solid var(--board-line); }
  .board-label { margin: 16px 16px 2px; color: var(--pencil); font-size: 15px; }
  .dep { display: grid; grid-template-columns: 44px 1fr auto; gap: 0 16px; align-items: start; width: 100%;
         text-align: left; background: none; border: 0; padding: 16px 16px; cursor: pointer; }
  /* platform number: a filled square plate, like the Gleis signs on German stations */
  .gleis { grid-row: span 2; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 3px;
           background: var(--ink); color: var(--platform); font-weight: 600; font-size: 17px; }
  .board.later .gleis { background: transparent; color: var(--pencil); box-shadow: inset 0 0 0 1.5px var(--rim); }
  .dest { font-weight: 600; font-size: 17px; line-height: 1.3; }
  .via { grid-column: 2 / 4; font-size: 15px; color: var(--pencil); }
  .announce { display: none; margin: 0 16px 16px 76px; padding: 2px 0 2px 12px; border-left: 3px solid var(--signal); }
  .board > li.open .announce { display: block; animation: fade-in 220ms var(--ease) both; }
  .announce p { margin: 0; font-size: 15px; max-width: 58ch; }
  .announce .links { margin-top: 0; }
  .announce .links li { border-color: var(--board-line); }

  /* Main line: the lit poster under the lamp */
  .mainline { display: grid; grid-template-columns: 48px 1fr; gap: 2px 16px; width: calc(100% - 32px); margin: 0 16px 4px;
              padding: 16px 16px 16px; border: 0; border-radius: var(--radius); text-align: left; cursor: pointer;
              background: var(--signal); color: var(--on-signal); border-radius: var(--radius-card); box-shadow: var(--lip);
              transition: transform 120ms ease-out; }
  .mainline:active { transform: translateY(1px); box-shadow: inset 0 -1px 0 rgba(0,0,0,.28); }
  .mainline .gleis { grid-row: span 4; width: 42px; height: 42px; background: var(--on-signal); color: var(--signal); font-size: 20px; }
  .mainline:focus-visible { outline: 3px solid var(--on-board); outline-offset: 2px; }
  .m-dest { font-size: 26px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; }
  .m-via { font-size: 15px; }
  .m-count { font-size: 15px; font-weight: 600; }
  .m-cta { margin-top: 12px; justify-self: start; padding: 7px 14px; border-radius: var(--radius-tag);
           background: var(--on-signal); color: var(--on-board); font-weight: 600; font-size: 15px; }

  /* ---- Links ---- */
  .links { list-style: none; margin: 4px 0 0; padding: 0; }
  .links li { border-bottom: 1px solid var(--rule); }
  .links li:last-child { border-bottom: 0; }
  .links a { display: block; padding: 12px 0; text-decoration: none; }
  .links .name { display: block; font-weight: 600; text-decoration: underline; text-decoration-color: var(--rim);
                 text-underline-offset: 3px; }
  .links .meta { display: block; font-size: 13px; color: var(--pencil); }

  /* ---- Buttons ---- */
  .btn { display: inline-block; margin-top: 12px; padding: 12px 16px; border: 0; border-radius: var(--radius);
         background: var(--signal); color: var(--on-signal); font-weight: 600; cursor: pointer;
         box-shadow: var(--lip); transition: transform 100ms ease-out; }
  .btn:active { transform: translateY(1px); box-shadow: inset 0 -1px 0 rgba(0,0,0,.28); }
  .btn.wide { width: 100%; margin-top: 24px; }
  .btn.big { min-height: 48px; padding: 12px 24px; font-size: 17px; margin-top: 16px; }
  .btn.line { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--rim); }
  .btn.danger { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 1.5px var(--danger); }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .backlink { all: unset; cursor: pointer; display: inline-block; margin: 16px 16px 0; padding: 12px 0 8px; font-weight: 600;
              color: var(--ink); border-bottom: 2px solid var(--rim); }
  .emp-link { all: unset; cursor: pointer; display: block; margin: 32px 16px 8px; padding: 16px 0; color: var(--pencil);
              text-decoration: underline; text-underline-offset: 4px; font-size: 15px; }

  /* ---- Enamel plates: solid, hairline edge, no shadow ---- */
  .card, .vac, .empty, .plain, .items, .topics, .form, .failed {
    border-radius: var(--radius-card); background: var(--plate); border: 1px solid var(--plate-edge); }
  .empty { background: transparent; border-style: dashed; }
  .card { margin: 12px 16px 0; padding: 16px; }
  .card h2 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
  .card h3 { margin: 0; font-size: 17px; line-height: 1.3; }
  .card p { margin: 8px 0 0; max-width: 60ch; }
  .card.profile { border-left-width: 4px; }
  .card.profile.pending { border-left-color: var(--rim); }
  .card.profile.approved { border-left-color: var(--success); }
  .card.profile.rejected { border-left-color: var(--danger); }
  .form { margin: 12px 16px 0; padding: 4px 16px 16px; }
  .plain { margin: 12px 16px 0; padding: 4px 16px 16px; }
  .plain p { max-width: 60ch; }
  .plain .quiet { color: var(--pencil); }
  .empty { margin: 12px 16px 0; padding: 16px; color: var(--pencil); font-size: 15px; }
  .price { margin: 12px 16px 0; padding: 16px; background: var(--board); color: var(--on-board); border-radius: var(--radius-card); }
  .price strong { font-size: 20px; display: block; }
  .price span { color: rgba(255,255,255,.8); font-size: 15px; }
  .items { margin: 12px 16px 0; overflow: hidden; }
  .item { border-bottom: 1px solid var(--rule); padding: 12px 16px; }
  .item:last-child { border-bottom: 0; }
  .item h3 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.3; }
  .item .meta { margin: 2px 0 0; font-size: 15px; color: var(--pencil); }
  .item .text { margin: 8px 0 0; font-size: 15px; white-space: pre-line; max-width: 60ch; }
  .item .more { display: none; }
  .item.open .more { display: block; }
  .item > button.toggle { all: unset; display: block; width: 100%; cursor: pointer; }
  .item > button.toggle:focus-visible { outline: 2px solid var(--signal); }
  .topics { margin: 12px 16px 0; overflow: hidden; }
  .topics details { border-bottom: 1px solid var(--rule); }
  .topics details:last-child { border-bottom: 0; }
  .topics summary { list-style: none; padding: 16px; font-weight: 600; cursor: pointer; display: flex;
                    justify-content: space-between; gap: 12px; }
  .topics summary::-webkit-details-marker { display: none; }
  .topics summary::after { content: "+"; color: var(--pencil); font-weight: 400; }
  .topics details[open] summary::after { content: "−"; }
  .topics details[open] > :not(summary) { animation: fade-in 220ms var(--ease) both; }
  .dep, .topics summary, .vac-head { transition: background-color 180ms var(--ease); }
  .dep:active, .topics summary:active, .vac-head:active { background-color: rgba(255,255,255,.04); }
  .topics .links { padding: 0 16px 8px; }

  /* ---- Badges and tags ---- */
  .badge { display: inline-block; font-size: 13px; font-weight: 600; padding: 2px 8px; margin-top: 8px; border-radius: var(--radius-tag);
           background: var(--board); color: var(--on-board); }
  .badge.ok { background: var(--success); color: var(--on-status); }
  .badge.no { background: var(--danger); color: var(--on-status); }
  .card .badge, .vac .badge { margin-top: 12px; }
  .done { font-weight: 600; color: var(--success); margin: 8px 0 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
  .tags span { font-size: 15px; padding: 4px 8px; border-radius: var(--radius-tag); background: var(--tag-bg); color: var(--ink); }
  .tags .pay { background: var(--board); color: var(--on-board); font-weight: 600; }

  /* ---- Forms ---- */
  .field { padding: 16px 0 0; }
  .field label { display: block; font-size: 13px; color: var(--pencil); }
  .field input, .field select { width: 100%; min-height: 44px; border: 0; border-bottom: 1.5px solid var(--field-line);
           padding: 8px 0 4px; border-radius: 0; appearance: none; -webkit-appearance: none; font-size: 17px; color: var(--ink);
           background-color: transparent; }
  .field input::placeholder, .field textarea::placeholder { color: var(--pencil); opacity: 1; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--signal); box-shadow: 0 1px 0 var(--signal); }
  .field textarea:focus { outline: none; border-color: var(--signal); box-shadow: inset 0 0 0 1px var(--signal); }
  .field [aria-invalid="true"] { border-color: var(--danger); }
  .field .err { margin: 8px 0 0; font-size: 15px; color: var(--danger); }
  .field textarea { width: 100%; border: 1.5px solid var(--rim); border-radius: var(--radius); background: var(--field-bg); padding: 8px;
                    font: inherit; font-size: 17px; color: var(--ink); min-height: 96px; resize: vertical; }
  .field select, .filter select {
    background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: calc(100% - 10px) 55%, calc(100% - 5px) 55%; background-size: 5px 5px; background-repeat: no-repeat;
    padding-right: 24px; }
  /* Desktop Telegram draws native select popups: give selects and options explicit colours. */
  select { color-scheme: dark; background-color: var(--platform) !important; color: var(--ink) !important; }
  .form select, .card select, .vac select { background-color: transparent !important; }   /* sits on the card; options keep their own colours */
  select option, select optgroup { background-color: var(--sheet) !important; color: var(--ink) !important; }
  .filter { margin: 12px 16px 0; }
  .filter select { width: 100%; min-height: 44px; border: 0; border-bottom: 1.5px solid var(--field-line); border-radius: 0;
                   padding: 8px 24px 4px 0; appearance: none; -webkit-appearance: none; font-size: 17px;
                   background-color: var(--platform) !important; }
  .check { display: flex; gap: 12px; align-items: center; min-height: 44px; padding-top: 16px; font-size: 15px; }
  .check input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--signal); flex: none; }
  .pick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .pick button { min-height: 44px; padding: 8px 16px; border: 1.5px solid var(--rim); border-radius: var(--radius); background: transparent;
                 transition: background-color 180ms var(--ease), border-color 180ms var(--ease), transform 180ms var(--ease);
                 color: var(--ink); font-size: 15px; cursor: pointer; }
  .pick button[aria-checked="true"] { background: var(--signal); border-color: var(--signal); color: var(--on-signal); font-weight: 600; }
  .form.big { font-size: 17px; }
  .form.big .field input, .form.big .field select { font-size: 17px; padding: 8px 0 8px; }
  .form.big .field label, .form.big .lbl { font-size: 15px; color: var(--pencil); display: block; }

  /* ---- Interactive fields: labels, switch, saved mark, swatches ---- */
  .lbl { margin: 16px 0 0; font-size: 13px; color: var(--pencil); }
  .seg--inline { margin: 8px 0 0; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 52px; margin-top: 12px;
            font-size: 15px; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch i { position: relative; flex: none; width: 50px; height: 30px; border-radius: 15px; background: var(--tag-bg);
              box-shadow: inset 0 0 0 1.5px var(--rim); transition: background-color 220ms var(--ease), box-shadow 220ms var(--ease); }
  .switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
                     background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.35); transition: transform 220ms var(--ease); }
  .switch input:checked + i { background: var(--signal); box-shadow: none; }

           transition: opacity 200ms var(--ease), transform 200ms var(--ease); }

  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 8px; }
  .swatch { display: grid; justify-items: center; gap: 6px; padding: 8px 2px; border: 0; border-radius: var(--radius); background: transparent;

  /* fields: boxed inputs; focus is a plain 2px line in the accent */

  /* ---- Step-by-step profile ---- */

  .wiz-progress p { margin: 0 0 8px; }
  .wiz-bar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }

  .wiz-row { all: unset; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%;
             padding: 12px 16px; border-bottom: 1px solid var(--rule); cursor: pointer; }
  .wiz-row:last-child { border-bottom: 0; }
  .wiz-row b { display: block; font-size: 15px; } .wiz-row .meta { display: block; font-size: 13px; color: var(--pencil); white-space: pre-line; }

                   margin: 16px 16px 0; padding: 16px; border: 0; border-radius: var(--radius-card); color: var(--on-signal);
                   background: var(--signal); box-shadow: var(--lip);
                   font-size: 17px; text-align: left; cursor: pointer; }

                        font-weight: 600; font-size: 15px; white-space: nowrap; }
  .vac { margin: 12px 16px 0; transition: box-shadow 200ms var(--ease); }
  .vac.open { border-color: var(--signal); }
  .vac-head { all: unset; display: block; box-sizing: border-box; width: 100%; padding: 16px 16px; cursor: pointer; }
  .vac-head:focus-visible { outline: 2px solid var(--signal); }
  .vac-head h3 { margin: 0; font-size: 20px; line-height: 1.3; font-weight: 600; }
  .co { margin: 3px 0 0; color: var(--pencil); font-size: 15px; }
  .vac-body { padding: 0 16px 16px; }
  .vac-body .text, .card .text { white-space: pre-line; margin: 0 0 12px; }

  /* ---- Loading and failure ---- */
  .skel { padding: 16px 16px 0; }
  .skel span { display: block; height: 18px; margin: 0 0 16px; border-radius: var(--radius); background: var(--tag-bg); }
  .skel .tall { height: 112px; margin-bottom: 24px; }

  .failed { margin: 16px; padding: 16px; border-radius: var(--radius-card); background: var(--plate); border: 1px solid var(--danger); }
  .failed p { margin: 0; max-width: 60ch; }

  @media (hover: hover) {
    .btn:hover, .mainline:hover, .invite-banner:hover, .dep:hover, .vac-head:hover, .pick button:hover, .seg button:hover,
    .topics summary:hover, nav button:hover, .backlink:hover, .emp-link:hover {
      background-image: linear-gradient(rgba(255,255,255,.06), rgba(255,255,255,.06)); }
  }
  /* light mode: the dark-on-accent CTA pill flips to white, so its text takes the palette ink */
  [data-mode="light"] .m-cta, [data-mode="light"] .invite-banner span { color: var(--p-accent-ink); }

  /* ---- Bottom bar: frosted, so the platform shows through; the current tab has a bar above the word ---- */
  nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 4px; padding: 6px 8px calc(8px + env(safe-area-inset-bottom));
        background: var(--bar); border-top: 1px solid var(--plate-edge);

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
if (tg?.colorScheme === "dark") document.documentElement.dataset.theme = "dark";
const cssVar = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();


// What the header scene shows; set from the user's job route (renderSign), read by the canvas loop.
// rain: waiting for review or for offers; train "standing": an offer waits for an answer, otherwise trains pass by.
const SCENE = { rain: true, train: "passing", ink: "#02140F" };

// ---- Appearance: palette × mode, chosen in Profile. Saved on this phone and in Telegram's cloud. ----
const PALETTES = ["emerald", "sapphire", "amethyst", "amber", "graphite"];
const THEME_KEY = "ui_theme_v1";
function readTheme() {
  try { const t = JSON.parse(localStorage.getItem(THEME_KEY) || "{}");
        return { mode: ["auto", "dark", "light"].includes(t.mode) ? t.mode : "auto", palette: PALETTES.includes(t.palette) ? t.palette : "emerald" }; }
  catch { return { mode: "auto", palette: "emerald" }; }
}
let THEME = readTheme();
function applyTheme(t = THEME, persist = false) {
  THEME = t;
  const mode = t.mode === "auto" ? (tg?.colorScheme === "light" ? "light" : "dark") : t.mode;
  const root = document.documentElement;
  root.dataset.palette = t.palette; root.dataset.mode = mode;
  SCENE.ink = cssVar("--p-scene") || SCENE.ink;
  try { tg?.setHeaderColor?.(cssVar("--p-sky1")); tg?.setBackgroundColor?.(cssVar("--p-deep") && mode === "light" ? cssVar("--p-tint") : cssVar("--p-deep"));
        tg?.setBottomBarColor?.(mode === "light" ? cssVar("--p-tint") : cssVar("--p-deep")); } catch {}
  window.redrawScene?.();
  if (persist) {
    try { localStorage.setItem(THEME_KEY, JSON.stringify(t)); } catch {}
    try { tg?.CloudStorage?.setItem(THEME_KEY, JSON.stringify(t)); } catch {}
  }
}
applyTheme();
tg?.onEvent?.("themeChanged", () => { if (THEME.mode === "auto") applyTheme(); });
try { tg?.CloudStorage?.getItem(THEME_KEY, (e, v) => {   // same look on another phone
  if (e || !v) return;
  try { const t = JSON.parse(v); if (t.mode !== THEME.mode || t.palette !== THEME.palette) { applyTheme({ mode: t.mode, palette: t.palette }); try { localStorage.setItem(THEME_KEY, v); } catch {} if (typeof renderProfile === "function" && META) renderProfile(); } } catch {}
}); } catch {}

// Night platform: rain, a warm station lamp with a light cone, low drifting fog.
// One static frame when the user prefers reduced motion; paused while the page is hidden.
(function scene() {
  const c = document.getElementById("rain");
  if (!c) return;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ctx = c.getContext("2d"), dpr = Math.min(devicePixelRatio || 1, 2);
  const LIGHT = "255,198,112";
  let w, h, drops = [], fog = [], lamp;
  const train = { x: 0, on: false, next: performance.now() + 4000 };
  function size() {
    w = c.clientWidth; h = c.clientHeight; c.width = w * dpr; c.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const px = w - 50;                                   // post
    lamp = { px, top: 16, hx: px - 30, hy: 34 };          // lantern hangs from an arm
    drops = Array.from({ length: Math.round(w / 6) }, () => ({ x: Math.random() * w, y: Math.random() * h,
      l: 7 + Math.random() * 12, v: 4 + Math.random() * 4, a: .08 + Math.random() * .16 }));
    fog = Array.from({ length: 4 }, (_, i) => ({ x: Math.random() * w, y: h - 10 - Math.random() * 34,
      rx: 120 + Math.random() * 110, ry: 22 + Math.random() * 14, v: .12 + Math.random() * .18, a: .10 + i * .025 }));
  }
  function inCone(x, y) {
    if (y < lamp.hy + 10) return 0;
    const half = 8 + (y - lamp.hy) * .55, d = Math.abs(x - lamp.hx);
    return d < half ? 1 - d / half : 0;
  }
  function drawLamp() {
    const { px, top, hx, hy } = lamp;
    // glow and cone
    let g = ctx.createRadialGradient(hx, hy + 8, 2, hx, hy + 8, 120);
    g.addColorStop(0, `rgba(${LIGHT},.45)`); g.addColorStop(.35, `rgba(${LIGHT},.12)`); g.addColorStop(1, `rgba(${LIGHT},0)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.beginPath(); ctx.moveTo(hx - 7, hy + 12); ctx.lineTo(hx + 7, hy + 12);
    ctx.lineTo(hx + 8 + (h - hy) * .55, h); ctx.lineTo(hx - 8 - (h - hy) * .55, h); ctx.closePath();
    g = ctx.createLinearGradient(0, hy, 0, h);
    g.addColorStop(0, `rgba(${LIGHT},.20)`); g.addColorStop(1, `rgba(${LIGHT},.04)`);
    ctx.fillStyle = g; ctx.fill();
    // post, arm, lantern
    ctx.fillStyle = SCENE.ink;
    ctx.fillRect(px - 2, top, 4, h - top);
    ctx.fillRect(px - 4, h - 8, 8, 8);
    ctx.strokeStyle = SCENE.ink; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(px, top + 4); ctx.quadraticCurveTo(px - 14, top - 4, hx, top + 4); ctx.stroke();
    ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(hx, top + 4); ctx.lineTo(hx, hy - 6); ctx.stroke();
    ctx.fillStyle = SCENE.ink;
    ctx.beginPath(); ctx.moveTo(hx - 11, hy - 1); ctx.lineTo(hx + 11, hy - 1); ctx.lineTo(hx + 5, hy - 7); ctx.lineTo(hx - 5, hy - 7); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.shadowColor = `rgba(${LIGHT},.95)`; ctx.shadowBlur = 18;
    ctx.fillStyle = "#FFE3B0";
    ctx.beginPath(); ctx.moveTo(hx - 9, hy - 1); ctx.lineTo(hx + 9, hy - 1); ctx.lineTo(hx + 6, hy + 11); ctx.lineTo(hx - 6, hy + 11); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle = SCENE.ink; ctx.fillRect(hx - 7, hy + 11, 14, 2);
  }
  // Distant regional train crossing the horizon now and then (generic, no operator branding).
  function drawTrain(ts) {
    if (SCENE.train === "standing") {
      if (!train.stand) { train.stand = true; train.on = true; train.x = still ? 0 : -260; }
    } else { train.stand = false; if (still) return; }
    if (!train.on && ts > train.next) { train.on = true; train.x = -260; }
    if (!train.on) return;
    const y = h - 20, len = 250, carH = 7;   // runs below the text, above the platform edge
    ctx.save(); ctx.globalAlpha = .55;
    ctx.fillStyle = "#DCE3EE"; ctx.fillRect(train.x, y, len, carH);
    ctx.beginPath(); ctx.moveTo(train.x + len, y); ctx.quadraticCurveTo(train.x + len + 14, y + 1, train.x + len + 16, y + carH);
    ctx.lineTo(train.x + len, y + carH); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#B8243A"; ctx.fillRect(train.x, y + carH - 2, len + 14, 1.5);
    ctx.fillStyle = "rgba(255,214,150,.95)";
    for (let i = 4; i < len - 4; i += 7) { if (i % 50 > 44) continue; ctx.fillRect(train.x + i, y + 1.5, 4, 2.5); }
    ctx.fillStyle = SCENE.ink; for (let i = 50; i < len; i += 50) ctx.fillRect(train.x + i - 1, y, 2, carH);
    ctx.restore();
    if (SCENE.train === "standing") {   // pull in and stop at the platform
      train.x = still ? 0 : Math.min(0, train.x + Math.max(.6, -train.x * .06));
      return;
    }
    ctx.fillStyle = "rgba(255,255,255,.08)"; ctx.fillRect(0, y + carH + 1, w, 1);   // rails, barely visible
    train.x += 3.6;
    if (train.x > w + 20) { train.on = false; train.next = ts + 20000 + Math.random() * 25000; }
  }
  function drawBench() {
    const { px } = lamp, x0 = px - 64, x1 = px - 16, seat = h - 14;
    ctx.fillStyle = SCENE.ink;
    ctx.fillRect(x0, seat, x1 - x0, 3);                 // seat
    ctx.fillRect(x0 + 1, seat - 10, x1 - x0 - 2, 2);     // backrest boards
    ctx.fillRect(x0 + 1, seat - 6, x1 - x0 - 2, 2);
    ctx.fillRect(x0 + 3, seat - 11, 2, 11); ctx.fillRect(x1 - 5, seat - 11, 2, 11);   // back posts
    ctx.fillRect(x0 + 3, seat + 3, 2, 11); ctx.fillRect(x1 - 5, seat + 3, 2, 11);     // legs
    ctx.fillStyle = "rgba(255,198,112,.35)"; ctx.fillRect(x0, seat, x1 - x0, 1);        // lamp light on the seat edge
  }
  function drawFog() {
    for (const f of fog) {
      ctx.save(); ctx.translate(f.x, f.y); ctx.scale(1, f.ry / f.rx);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, f.rx);
      g.addColorStop(0, `rgba(214,226,245,${f.a})`); g.addColorStop(1, "rgba(214,226,245,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, f.rx, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      if (!still) { f.x += f.v; if (f.x - f.rx > w) f.x = -f.rx; }
    }
  }
  function drawRain() {
    if (!SCENE.rain) return;
    ctx.lineWidth = 1; ctx.lineCap = "round";
    for (const d of drops) {
      const k = inCone(d.x, d.y);
      ctx.strokeStyle = k ? `rgba(255,226,170,${Math.min(.85, d.a + k * .6)})` : `rgba(255,255,255,${d.a})`;
      ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.l * .18, d.y + d.l); ctx.stroke();
      if (!still) { d.y += d.v; d.x -= d.v * .18; if (d.y > h) { d.y = -d.l; d.x = Math.random() * (w + 20); } }
    }
  }
  function draw(ts = 0) { ctx.clearRect(0, 0, w, h); drawTrain(ts); drawLamp(); drawBench(); drawRain(); drawFog(); }
  size(); addEventListener("resize", () => { size(); draw(); });
  window.redrawScene = () => draw(performance.now());   // a still frame must follow SCENE changes too
  if (still) { draw(); return; }
  let last = 0;
  (function frame(ts) {
    requestAnimationFrame(frame);
    if (document.hidden || ts - last < 33) return; last = ts; draw(ts);
  })(0);
})();

const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json",
    "X-Telegram-Init-Data": tg?.initData || "", ...(opts.headers || {}) } });
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

let toastTimer;
const skeleton = () => `<div class="skel" aria-busy="true"><p class="sr">${esc(L().loading)}</p><span class="tall"></span><span></span><span class="short"></span><span></span></div>`;
function failed(el, retry) {
  el.innerHTML = `<div class="failed" role="alert"><p>${esc(L().loadError)}</p><button class="btn" type="button">${esc(L().retry)}</button></div>`;
  el.querySelector("button").onclick = () => { el.innerHTML = skeleton(); retry(); };
}

// Inline validation: the message sits under the field it belongs to, not in a toast.
function validate(form) {
  form.querySelectorAll(".field .err").forEach(n => n.remove());
  let first = null;
  form.querySelectorAll("[required]").forEach(el => {
    const bad = !el.value.trim();
    el.setAttribute("aria-invalid", bad ? "true" : "false");
    if (!bad) { el.removeAttribute("aria-describedby"); return; }
    const msg = document.createElement("p");
    msg.className = "err"; msg.id = el.id + "-err"; msg.textContent = L().required;
    el.closest(".field").appendChild(msg);
    el.setAttribute("aria-describedby", msg.id);
    first = first || el;
  });
  if (first) { first.focus(); first.scrollIntoView({ block: "center" }); return false; }
  return true;
}
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.getAttribute?.("aria-invalid") === "true" && el.value.trim()) {
    el.setAttribute("aria-invalid", "false"); el.removeAttribute("aria-describedby");
    el.closest(".field")?.querySelector(".err")?.remove();
  }
});

function toast(text) {
  const el = $("toast"); el.textContent = text; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

function show(page) {
  for (const p of ["home", "jobs", "housing", "profile", "info", "privacy"]) $("page-" + p).classList.toggle("on", p === page);
  $("nav").querySelectorAll("button").forEach(b =>
    b.dataset.page === page ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  window.scrollTo(0, 0);
  tg?.HapticFeedback?.selectionChanged();
  CURRENT = page;
  if (tg?.BackButton) page === "home" ? tg.BackButton.hide() : tg.BackButton.show();
}

tg?.BackButton?.onClick?.(() => { if (CURRENT === "jobs" && jobsBack()) return; show("home"); });

function renderNav() {

function linkList(topic) {
  const seen = new Set();

     <span class="meta">${esc(host(x.url))}${x.checked_at ? ", " + esc(L().checked(fmtDate(x.checked_at))) : ""}</span></a></li>`
  ).join("")}</ul>`;
}

function sheetBody(k) {

  if (L().soon[k]) return `<p>${esc(L().soon[k])}</p><button class="btn" data-chat>${esc(L().toChat)}</button>`;
  return "";
}

// ---- The board follows the user's job route (same logic as the new app at /app-v2) ----
const ROUTE = { new: [0, true], rejected: [0, true], review: [1, false], published: [2, false], paused: [2, false],
                offers: [3, true], contact: [4, false] };
function jobState() {
  const me = JOBS?.me; if (!me) return null;
  const s = me.seeker, offers = (me.inbox || []).filter(c => c.kind === "offer");
  if (!s) return "new";
  if (s.status === "rejected") return "rejected";
  if (s.status === "pending") return "review";
  if (offers.some(c => c.status === "sent")) return "offers";
  if (offers.some(c => c.status === "accepted")) return "contact";
  return s.is_active ? "published" : "paused";
}
// A real place only: a name in Latin letters (German places), else the Land, else nothing. Junk like "Ччч" never shows.
function placeName(city, land) {
  const c = (city || "").trim();
  if (/^[A-Za-zÄÖÜäöüß][A-Za-zÄÖÜäöüß .()\-]{1,}$/.test(c)) return c;
  return land && META?.lands?.[land] ? META.lands[land] : null;
}
function renderSign() {
  const T = L(), st = jobState(), s = JOBS?.me?.seeker;
  const now = new Date(), hh = String(now.getHours()).padStart(2, "0"), mm = String(now.getMinutes()).padStart(2, "0");
  const place = placeName(s?.city || ME?.city, s?.land || ME?.land);
  $("owner").textContent = T.yours;
  $("updated").textContent = `${hh}:${mm}`; $("updated").dateTime = `${hh}:${mm}`;
  $("title").textContent = place || T.noCity;
  $("station-sub").textContent = s?.position || (place ? "" : T.noCityHint);
  SCENE.rain = st === null || st === "review" || st === "published";          // waiting
  SCENE.train = st === "offers" || st === "contact" ? "standing" : "passing";  // an offer has arrived
  window.redrawScene?.();
}

function renderHome() {
  const [main, ...rest] = L().sections;
  const nVac = JOBS?.vacancies?.length || 0;
  const st = jobState();
  const waiting = (JOBS?.me?.inbox || []).filter(c => c.kind === "offer" && c.status === "sent").length;
  $("page-home").innerHTML = `<div class="board-wrap">
    <button class="mainline" data-k="${main[0]}">
      <span class="gleis" aria-hidden="true">1</span>
      <span class="m-dest">${esc(main[1])}</span>

      ${st ? `<span class="m-count">${esc(L().step(ROUTE[st][0] + 1, L().steps[ROUTE[st][0]]))}</span>`
           : nVac ? `<span class="m-count">${esc(L().openVac(nVac))}</span>` : ""}
      <span class="m-cta">${esc(st ? L().jobCta[st] : L().findJob)}</span>
    </button>
    ${[[1, L().help], [0, L().later]].map(([ok, label]) => `<p class="board-label">${esc(label)}</p>
    <ol class="board ${ok ? "" : "later"}">${rest.filter(r => !!r[3] === !!ok).map(([k, name, via]) => `
    <li data-k="${k}">
      <button class="dep" aria-expanded="false">
        <span class="gleis" aria-hidden="true">${rest.findIndex(r => r[0] === k) + 2}</span>
        <span class="dest">${esc(name)}</span>
        <span class="via">${esc(via)}</span>
      </button>
      <div class="announce">${sheetBody(k)}</div>

  $("page-home").querySelector(".mainline").onclick = () => {
    JOBS.sub = st === "new" || st === "rejected" ? "form" : st === "offers" ? "inbox" : null;
    renderJobs(); show("jobs");

  renderSign();
  $("page-home").querySelectorAll(".board > li").forEach(li => {
    const btn = li.querySelector(".dep");
    btn.onclick = () => {
      if (li.dataset.k === "info") return show("info");

        o.classList.remove("open"); o.querySelector(".dep").setAttribute("aria-expanded", "false"); });
      li.classList.toggle("open", open); btn.setAttribute("aria-expanded", String(open));
      tg?.HapticFeedback?.selectionChanged();
    };
  });
  $("page-home").querySelectorAll("[data-chat]").forEach(b => b.onclick = () => tg?.close());
  bindLinks($("page-home"));
}

      <p class="lbl">${esc(T.status)}</p>${chips("p-status", m.statuses, me.residence_status, v => T.statuses[v])}
      <label class="switch"><span>${esc(T.broadcast)}</span>

    </div>`;
  bindAppearance(root);
  root.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => saveProfile({ language: b.dataset.lang }));

    const on = b.getAttribute("aria-checked") !== "true";          // tap again to clear
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-checked", String(on && x === b)));

  $("f-broadcast").onchange = (e) => { tg?.HapticFeedback?.selectionChanged(); saveProfile({ broadcast_consent: e.target.checked }); };
}

let savedTimer;
async function saveProfile(patch) {
  const mark = $("p-saved");
  try {
    await api("/api/me", { method: "PATCH", body: JSON.stringify(patch) });
    ME = { ...ME, ...patch };
    if (patch.language && patch.language !== lang) { lang = patch.language; renderAll("profile"); toast(L().saved); return; }
    if ("city" in patch || "land" in patch) renderSign();
    if (mark) { mark.textContent = L().savedShort; mark.classList.add("on"); clearTimeout(savedTimer);

const JL = () => J[lang] || J.uk;
let JOBS = { me: null, view: "seeker", sub: null, land: null, vacancies: [], seekers: [], openVac: null, applyFor: null };

async function japi(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json",
    "X-Telegram-Init-Data": tg?.initData || "", ...(opts.headers || {}) } });
  let data = null; try { data = await res.json(); } catch {}
  if (!res.ok) { const e = new Error(res.status); e.code = res.status === 422 ? "invalid" : (data && data.detail); throw e; }
  return data;
}
const jerr = (e) => {
  const m = /^submit_limit:(\d+)$/.exec(e.code || "");
  toast(m ? JL().errors.submit_limit(m[1]) : (JL().errors[e.code] || JL().errors.other));
};
const badge = (st) => `<span class="badge ${["approved", "accepted", "sent"].includes(st) ? "ok" : ["rejected", "declined", "closed"].includes(st) ? "no" : ""}">${esc(JL().status[st] || st)}</span>`;
const landName = (c) => c ? (META.lands[c] || c) : "";
const where = (o) => [o.city, landName(o.land)].filter((x, i, arr) => x && arr.indexOf(x) === i).join(", ");
const field = (id, label, control, hint = "") => `<div class="field"><label for="${id}">${esc(label)}</label>${control}${hint ? `<p class="hint">${esc(hint)}</p>` : ""}</div>`;
const chips = (name, list, current, labelFn) => `<div class="pick" role="radiogroup" data-name="${name}">${list.map(v =>
  `<button type="button" role="radio" aria-checked="${v === current}" data-v="${esc(v)}">${esc(labelFn(v))}</button>`).join("")}</div>`;
const pickVal = (root, name) => root.querySelector(`.pick[data-name="${name}"] [aria-checked="true"]`)?.dataset.v || null;
function bindPicks(root) {
  root.querySelectorAll(".pick").forEach(g => g.querySelectorAll("button").forEach(b => b.onclick = () => {
    g.querySelectorAll("button").forEach(x => x.setAttribute("aria-checked", String(x === b)));
    tg?.HapticFeedback?.selectionChanged();
  }));
}

async function loadJobs() {
  if (!tg?.initData) return;
  JOBS.land = JOBS.land ?? (ME?.land || "");
  try {
    const q = JOBS.land ? `?land=${encodeURIComponent(JOBS.land)}` : "";
    [JOBS.me, JOBS.vacancies] = await Promise.all([japi("/api/jobs/me"), japi("/api/jobs/vacancies" + q)]);
    JOBS.seekers = JOBS.me.employer?.has_access ? await japi("/api/jobs/seekers" + q) : [];
    if (JOBS.me.employer && !JOBS.me.seeker && JOBS.view === "seeker" && !JOBS.sub) JOBS.view = "employer";
    JOBS.failed = false;
  } catch (e) { if (JOBS.me) jerr(e); else JOBS.failed = true; }
  renderJobs();
  if (!$("page-home").querySelector(".board > li.open")) renderHome();
}

function jobsBack() {
  if (wizBack()) return true;
  if (JOBS.sub) { JOBS.sub = null; renderJobs(); window.scrollTo(0, 0); return true; }
  if (JOBS.view === "employer" && JOBS.me?.seeker) { JOBS.view = "seeker"; renderJobs(); return true; }
  return false;
}

function renderJobs() {
  const root = $("page-jobs"); if (!root) return;
  const T = JL();
  if (!tg?.initData) { root.innerHTML = `<div class="head"><h2>${esc(T.title)}</h2><p>${esc(L().openInTg)}</p></div>`; return; }
  if (!JOBS.me) {
    root.innerHTML = `<div class="head"><h2>${esc(T.title)}</h2></div><div id="jstate"></div>`;
    if (JOBS.failed) failed($("jstate"), loadJobs); else $("jstate").innerHTML = skeleton();
    return;
  }
  const sub = JOBS.sub;
  const backBar = (sub || JOBS.view === "employer") ? `<button class="backlink" id="jback">${esc(T.back)}</button>` : "";
  root.innerHTML = `<div class="jobs">${backBar}<div id="jbody"></div></div>`;
  const back = $("jback"); if (back) back.onclick = () => { if (!jobsBack()) show("home"); };
  const body = $("jbody");
  if (sub === "form") return jSeekerForm(body);
  if (sub === "inbox") return jInbox(body);
  if (JOBS.view === "employer") return jEmployer(body);
  jSeekerHome(body);
}

  const profState = !p ? ["", T.profNone, T.profFill] : p.status === "pending" ? ["pending", T.profPending, T.edit]
    : p.status === "approved" ? ["approved", T.profApproved, T.edit] : ["rejected", T.profRejected, T.fix];
  const vacs = JOBS.vacancies.map(v => {
    const open = JOBS.openVac === v.id, applying = JOBS.applyFor === v.id;
    return `<article class="vac${open ? " open" : ""}">
      <button class="vac-head" data-vac="${v.id}" aria-expanded="${open}">
        <h3>${esc(v.title)}</h3><p class="co">${esc(v.company)}, ${esc(where(v))}</p>
        <p class="tags"><span>${esc(T.emp[v.employment])}</span><span>${esc(v.german_level ? T.germanFrom(v.german_level) : T.noGerman)}</span>${v.salary ? `<span class="pay">${esc(v.salary)}</span>` : ""}</p>
      </button>
      ${open ? `<div class="vac-body"><p class="text">${esc(v.description)}</p>
        ${appliedTo.has(v.id) ? `<p class="done">${esc(T.applied)}</p>`
          : p?.status !== "approved" ? `<p class="hint">${esc(T.needProfile)}</p><button class="btn big" data-go="form">${esc(T.profFill)}</button>`
          : applying ? `${field("am-" + v.id, T.applyLabel, `<textarea id="am-${v.id}" maxlength="600">${esc(T.applyText)}</textarea>`)}
              <button class="btn big" data-send="${v.id}">${esc(T.sendApply)}</button>`
          : `<button class="btn big" data-apply="${v.id}">${esc(T.apply)}</button>`}
      </div>` : ""}
    </article>`;
  }).join("");
  body.innerHTML = `
    ${waiting.length ? `<button class="invite-banner" data-go="inbox"><strong>${esc(T.invites(waiting.length))}</strong><span>${esc(T.look)}</span></button>` : ""}
    <section class="card profile ${profState[0]}">
      <h2>${esc(T.profTitle)}</h2>${p ? badge(p.status) : ""}
      <p>${esc(profState[1])}</p>
      ${p?.status === "approved" ? `<label class="check"><input type="checkbox" id="s-active" ${p.is_active ? "checked" : ""}> ${esc(T.visible)}</label>` : ""}
      <div class="row-btns"><button class="btn big ${p ? "line" : ""}" data-go="form">${esc(profState[2])}</button>
      ${(myApps.length || me.inbox.length) && !waiting.length ? `<button class="btn big line" data-go="inbox">${esc(T.inboxTitle)}</button>` : ""}</div>
    </section>
    <h2 class="sec">${esc(T.vacTitle)}</h2>
    <div class="filter"><select id="jland" aria-label="${esc(T.land)}"><option value="">${esc(T.allLands)}</option>${Object.keys(META.lands).map(c =>
      `<option value="${c}" ${c === JOBS.land ? "selected" : ""}>${esc(META.lands[c])}</option>`).join("")}</select></div>
    ${vacs || `<div class="card"><p>${esc(T.noVac)}</p></div>`}
    <button class="emp-link" id="to-emp">${esc(T.employerLink)}</button>`;
  body.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { JOBS.sub = b.dataset.go; renderJobs(); window.scrollTo(0, 0); });
  body.querySelector("#jland").onchange = (e) => { JOBS.land = e.target.value; loadJobs(); };
  body.querySelector("#to-emp").onclick = () => { JOBS.view = "employer"; renderJobs(); window.scrollTo(0, 0); };
  body.querySelectorAll("[data-vac]").forEach(b => b.onclick = () => {
    const id = +b.dataset.vac; JOBS.openVac = JOBS.openVac === id ? null : id; JOBS.applyFor = null; renderJobs();
  });
  body.querySelectorAll("[data-apply]").forEach(b => b.onclick = () => { JOBS.applyFor = +b.dataset.apply; renderJobs(); });
  body.querySelectorAll("[data-send]").forEach(b => b.onclick = async () => {
    const id = +b.dataset.send; b.disabled = true;
    try { await japi("/api/jobs/applications", { method: "POST", body: JSON.stringify({ vacancy_id: id, message: $("am-" + id).value }) });
      toast(T.sentForReview); JOBS.applyFor = null; tg?.HapticFeedback?.notificationOccurred("success"); loadJobs(); }
    catch (e) { jerr(e); b.disabled = false; }
  });
  const act = body.querySelector("#s-active");
  if (act) act.onchange = async () => {
    try { await japi("/api/jobs/seeker/active", { method: "POST", body: JSON.stringify({ active: act.checked }) });
      toast(act.checked ? T.shown : T.hidden); } catch (e) { jerr(e); act.checked = !act.checked; }
  };
  bindLinks(body);
}

// Step-by-step profile (same flow as the new app): one question per screen, progress, draft in Telegram's cloud,
// a preview of exactly what employers see, then send. Fields map 1:1 onto PUT /api/jobs/seeker.
const WIZ_KEY = "seeker_draft_v1";
let WIZ = null;   // { step, d, fromPreview, restored }
function wizSave() { try { tg?.CloudStorage?.setItem(WIZ_KEY, JSON.stringify({ ...WIZ.d, step: WIZ.step })); } catch {} }
function wizClear() { try { tg?.CloudStorage?.removeItem ? tg.CloudStorage.removeItem(WIZ_KEY) : tg?.CloudStorage?.setItem(WIZ_KEY, ""); } catch {} }

function jSeekerForm(body) {
  if (!WIZ) {
    const p = JOBS.me.seeker || {};
    WIZ = { step: 1, fromPreview: false, d: { position: p.position || "", employment: p.employment || "any", shifts_ok: !!p.shifts_ok,
      land: p.land || ME?.land || null, city: p.city || ME?.city || "", german_level: p.german_level || ME?.german_level || null,
      experience: p.experience || "", about: p.about || "" } };
    try { tg?.CloudStorage?.getItem(WIZ_KEY, (e, v) => {          // continue where the user stopped
      if (e || !v || !WIZ || WIZ.touched) return;
      try { const x = JSON.parse(v); if (!x.position) return; const { step, ...d } = x;
            WIZ.d = { ...WIZ.d, ...d }; WIZ.step = Math.min(Math.max(+step || 1, 1), 6); WIZ.restored = true;
            if (JOBS.sub === "form") renderJobs(); } catch {}
    }); } catch {}
  }
  const T = JL(), W = T.wiz, d = WIZ.d, st = WIZ.step;
  const ok = (n) => ({ 1: d.position.trim().length >= 2, 2: !!d.land, 4: !!d.german_level, 5: d.experience.trim().length >= 2 })[n] ?? true;
  const need = { 1: W.needPosition, 2: W.needLand, 4: W.needLevel, 5: W.needExp };
  let html;
  if (st === "preview") {
    const where = [d.city, d.land ? META.lands[d.land] : null].filter((x, i, a) => x && a.indexOf(x) === i).join(", ");
    const rows = [[1, T.position, d.position], [2, T.city, where],
      [3, T.employment, T.emp[d.employment] + (d.shifts_ok ? ", " + T.shiftsOk.toLowerCase() : "")],
      [4, T.level, d.german_level === "A0" ? W.noGerman : d.german_level], [5, T.experience, d.experience], [6, T.about, d.about || "—"]];
    html = `<div class="head"><h2>${esc(W.previewTitle)}</h2></div>
      <article class="card wiz-preview"><h3>${esc(d.position)}</h3>
        <p class="co">${esc([where, T.emp[d.employment]].filter(Boolean).join(", "))}</p>
        <p class="tags"><span>${esc(d.german_level && d.german_level !== "A0" ? W.tagGerman(d.german_level) : W.tagNoGerman)}</span>${d.shifts_ok ? `<span>${esc(T.shifts)}</span>` : ""}</p>
        <p class="text">${esc(d.experience)}</p>${d.about ? `<p class="text">${esc(d.about)}</p>` : ""}
        <p class="hint">${esc(W.hidden)}</p></article>
      <div class="items">${rows.map(([n, k, v]) => `<button type="button" class="wiz-row" data-edit="${n}"><span><b>${esc(k)}</b><span class="meta">${esc(v)}</span></span><span class="wiz-edit">${esc(W.edit)}</span></button>`).join("")}</div>
      <p class="hint" style="margin:12px 16px">${esc(W.next)}</p>
      <div class="wiz-nav"><button type="button" class="btn wide big" id="wiz-send">${esc(T.submit)}</button></div>`;
  } else {
    html = `<div class="wiz-progress"><p>${esc(W.progress(st))}</p><div class="wiz-bar" role="progressbar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="${st}">${[1,2,3,4,5,6].map(n => `<i class="${n <= st ? "on" : ""}"></i>`).join("")}</div>${st === 1 ? `<p class="hint">${esc(W.anon)}</p>` : ""}</div>`
      + (WIZ.restored ? `<p class="hint" style="margin:8px 16px 0">${esc(W.restored)}</p>` : "") + `<div class="wiz-step">`;
    if (st === 1) html += `<h2 class="wiz-q">${esc(W.q1)}</h2><div class="form"><div class="field"><label for="w-pos">${esc(T.position)}</label>
        <input id="w-pos" maxlength="120" placeholder="${esc(T.positionPh)}" value="${esc(d.position)}"></div>
        <p class="lbl">${esc(W.popular)}</p><div class="pick">${W.common.map(c => `<button type="button" data-fill="${esc(c)}" aria-checked="${d.position === c}">${esc(c)}</button>`).join("")}</div></div>`;
    if (st === 2) html += `<h2 class="wiz-q">${esc(W.q2)}</h2><div class="form">
        <div class="field"><label for="w-land">${esc(T.land)}</label><select id="w-land">${opts(Object.keys(META.lands), d.land, v => META.lands[v], true)}</select></div>
        <div class="field"><label for="w-city">${esc(T.city)}</label><input id="w-city" maxlength="80" value="${esc(d.city)}"></div></div>`;
    if (st === 3) html += `<h2 class="wiz-q">${esc(W.q3)}</h2><div class="form">${chips("w-emp", META.employment, d.employment, v => T.emp[v])}
        <label class="switch"><span>${esc(T.shiftsOk)}</span><input type="checkbox" role="switch" id="w-shifts" ${d.shifts_ok ? "checked" : ""}><i aria-hidden="true"></i></label></div>`;
    if (st === 4) html += `<h2 class="wiz-q">${esc(W.q4)}</h2><div class="form">${chips("w-level", META.levels, d.german_level, v => v === "A0" ? W.noGerman : v === "C1" ? L().c1 : v)}
        <p class="hint">${esc(W.levelHint)}</p></div>`;
    if (st === 5) html += `<h2 class="wiz-q">${esc(W.q5)}</h2><div class="form"><div class="field"><label for="w-exp">${esc(T.experience)}</label>
        <textarea id="w-exp" maxlength="800" placeholder="${esc(T.experiencePh)}">${esc(d.experience)}</textarea>
        <p class="hint">${esc(W.noContacts)} <span id="w-cnt">${d.experience.length}</span>/800</p></div></div>`;
    if (st === 6) html += `<h2 class="wiz-q">${esc(W.q6)}</h2><div class="form"><div class="field"><label for="w-about">${esc(T.about)}</label>
        <textarea id="w-about" maxlength="500">${esc(d.about)}</textarea></div></div>`;
    html += `</div><div class="wiz-nav"><p class="hint" id="wiz-need" ${ok(st) ? "hidden" : ""}>${esc(need[st] || "")}</p>
      <button type="button" class="btn wide big" id="wiz-next" ${ok(st) ? "" : "disabled"}>${esc(st === 6 ? W.toPreview : W.next6)}</button></div>`;
  }
  body.innerHTML = html;
  const go = (n) => { WIZ.step = n; WIZ.restored = false; if (n !== "preview") wizSave(); renderJobs(); window.scrollTo(0, 0); tg?.HapticFeedback?.selectionChanged(); };
  const refresh = () => { WIZ.touched = true; const b = $("wiz-next"), h = $("wiz-need"); if (b) b.disabled = !ok(st); if (h) h.hidden = ok(st); };
  const next = $("wiz-next");
  if (next) next.onclick = () => { if (WIZ.fromPreview || st === 6) { WIZ.fromPreview = false; go("preview"); } else go(st + 1); };
  body.querySelectorAll("[data-fill]").forEach(b => b.onclick = () => {
    d.position = b.dataset.fill; $("w-pos").value = d.position;
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-checked", String(x === b)));
    refresh(); tg?.HapticFeedback?.selectionChanged(); });
  const on = (id, ev, fn) => { const el = $(id); if (el) el[ev] = fn; };
  on("w-pos", "oninput", (e) => { d.position = e.target.value; refresh(); });
  on("w-land", "onchange", (e) => { d.land = e.target.value || null; refresh(); });
  on("w-city", "oninput", (e) => { d.city = e.target.value; refresh(); });
  on("w-shifts", "onchange", (e) => { d.shifts_ok = e.target.checked; refresh(); tg?.HapticFeedback?.selectionChanged(); });
  on("w-exp", "oninput", (e) => { d.experience = e.target.value; $("w-cnt").textContent = d.experience.length; refresh(); });
  on("w-about", "oninput", (e) => { d.about = e.target.value; refresh(); });
  body.querySelectorAll(".pick[data-name] button").forEach(b => b.onclick = () => {
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-checked", String(x === b)));
    if (b.parentElement.dataset.name === "w-emp") d.employment = b.dataset.v; else d.german_level = b.dataset.v;
    refresh(); tg?.HapticFeedback?.selectionChanged();
  });
  body.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { WIZ.fromPreview = true; go(+b.dataset.edit); });
  const send = $("wiz-send");
  if (send) send.onclick = async () => {
    if (send.disabled) return;
    send.disabled = true;
    const data = { position: d.position.trim(), land: d.land, city: d.city.trim() || null, german_level: d.german_level,
      employment: d.employment || "any", shifts_ok: d.shifts_ok, experience: d.experience.trim(), about: d.about.trim() || null };
    try { await japi("/api/jobs/seeker", { method: "PUT", body: JSON.stringify(data) });
      wizClear(); WIZ = null; toast(T.sentForReview); tg?.HapticFeedback?.notificationOccurred("success"); JOBS.sub = null; loadJobs(); window.scrollTo(0, 0); }
    catch (err) { jerr(err); send.disabled = false; }
  };
}

// Back inside the step-by-step form: preview → step 6, edit → preview, step n → n-1, step 1 → leave the form.
function wizBack() {
  if (!WIZ || JOBS.sub !== "form") return false;
  if (WIZ.step === "preview") { WIZ.step = 6; renderJobs(); return true; }
  if (WIZ.fromPreview) { WIZ.fromPreview = false; WIZ.step = "preview"; renderJobs(); return true; }
  if (WIZ.step > 1) { WIZ.step -= 1; wizSave(); renderJobs(); window.scrollTo(0, 0); return true; }
  return false;
}

function jInbox(body) {
  const T = JL(), me = JOBS.me;
  const invites = me.inbox.filter(c => c.kind === "offer");
  const apps = me.outbox.filter(c => c.kind === "apply");
  const item = (c, answer) => `<article class="card">
      <h3>${esc(T.from(c.company || ""))}</h3>${c.vacancy ? `<p class="co">${esc(T.onVac(c.vacancy))}</p>` : ""}
      <p class="text">«${esc(c.message)}»</p>${badge(c.status)}
      ${answer && c.status === "sent" ? `<div class="row-btns"><button class="btn big" data-ans="${c.id}:1">${esc(T.agree)}</button>
        <button class="btn big line" data-ans="${c.id}:0">${esc(T.refuse)}</button></div>` : ""}
    </article>`;
  body.innerHTML = `${invites.length ? `<div class="head"><h2>${esc(T.inboxTitle)}</h2><p>${esc(T.inboxExplain)}</p></div>${invites.map(c => item(c, true)).join("")}`
      : `<div class="head"><h2>${esc(T.inboxTitle)}</h2></div><div class="empty">${esc(T.inboxEmpty)}</div>`}
    ${apps.length ? `<h2 class="sec">${esc(T.myApps)}</h2>${apps.map(c => item(c, false)).join("")}` : ""}
    <p class="hint" style="margin:14px 16px">${esc(T.noScam)}</p>`;
  body.querySelectorAll("[data-ans]").forEach(b => b.onclick = async () => {
    const [id, ok] = b.dataset.ans.split(":");
    try { await japi(`/api/jobs/requests/${id}/answer`, { method: "POST", body: JSON.stringify({ accept: ok === "1" }) });
      tg?.HapticFeedback?.notificationOccurred("success"); loadJobs(); } catch (e) { jerr(e); }
  });
}

function jEmployer(body) {
  const T = JL(), e = JOBS.me.employer;
  const [p1, p2] = T.priceLine(META.employer_price_eur, META.employer_pilot_days);
  const head = `<div class="head"><h2>${esc(T.empTitle)}</h2></div>`;
  const regForm = (x = {}) => `<form class="form big" id="ef" novalidate>
      ${field("e-company", T.company, `<input id="e-company" maxlength="160" required value="${esc(x.company || "")}">`)}
      ${field("e-address", T.address, `<input id="e-address" maxlength="240" required value="${esc(x.address || "")}">`)}
      ${field("e-reg", T.register, `<input id="e-reg" maxlength="80" required value="${esc(x.register_no || "")}">`)}
      ${field("e-person", T.person, `<input id="e-person" maxlength="120" required value="${esc(x.contact_person || "")}">`)}
      ${field("e-contact", T.contact, `<input id="e-contact" maxlength="160" required value="${esc(x.contact || "")}">`)}
      ${field("e-web", T.website, `<input id="e-web" maxlength="200" value="${esc(x.website || "")}">`)}
      <button class="btn wide big" type="submit">${esc(T.saveEmp)}</button></form>`;
  if (!e || e.status === "rejected") {
    body.innerHTML = head + `<div class="head"><p>${esc(T.empIntro)}</p></div>
      <div class="price"><strong>${esc(p1)}</strong><span>${esc(p2)}</span></div>
      ${e ? `<div class="card"><p>${esc(T.empRejected)}</p></div>` : ""}${regForm(e || {})}`;
  } else if (e.status === "pending") {
    body.innerHTML = head + `<div class="card"><p>${esc(T.empPending)}</p></div>`;
  } else if (!e.has_access) {
    body.innerHTML = head + `<div class="card"><p>${esc(T.empExpired(fmtDate(e.access_until)))}</p></div>`;
  } else {
    const openVacs = e.vacancies.filter(v => v.status === "approved");
    const responses = JOBS.me.inbox.filter(c => c.kind === "apply");
    const cands = JOBS.seekers.map(s => `<article class="vac${JOBS.openVac === -s.id ? " open" : ""}">
        <button class="vac-head" data-cand="${s.id}"><h3>${esc(s.position)}</h3><p class="co">${esc(where(s))}</p>
          <p class="tags"><span>${esc(T.emp[s.employment])}</span><span>${esc(s.german_level ? T.germanFrom(s.german_level) : T.noGerman)}</span>${s.shifts_ok ? `<span>${esc(T.shifts)}</span>` : ""}</p></button>
        ${JOBS.openVac === -s.id ? `<div class="vac-body"><p class="text">${esc(T.expShort)}: ${esc(s.experience)}</p>${s.about ? `<p class="text">${esc(s.about)}</p>` : ""}
          ${openVacs.length ? field("ov-" + s.id, T.forVac, `<select id="ov-${s.id}"><option value="">${esc(T.noVacOpt)}</option>${openVacs.map(v => `<option value="${v.id}">${esc(v.title)}</option>`).join("")}</select>`) : ""}
          ${field("om-" + s.id, T.inviteMsg, `<textarea id="om-${s.id}" maxlength="600"></textarea>`)}
          <button class="btn big" data-offer="${s.id}">${esc(T.invite)}</button></div>` : ""}</article>`).join("");
    const resp = responses.map(c => `<article class="card"><h3>${esc(c.seeker?.position || "")}</h3>
        <p class="co">${esc(c.vacancy ? T.onVac(c.vacancy) : "")}${c.seeker ? ", " + esc(where(c.seeker)) : ""}</p>
        ${c.seeker ? `<p class="text">${esc(T.expShort)}: ${esc(c.seeker.experience)}</p>` : ""}<p class="text">«${esc(c.message)}»</p>${badge(c.status)}
        ${c.status === "sent" ? `<div class="row-btns"><button class="btn big" data-ans="${c.id}:1">${esc(T.agree)}</button><button class="btn big line" data-ans="${c.id}:0">${esc(T.refuse)}</button></div>` : ""}</article>`).join("");
    const vacs = e.vacancies.map(v => `<article class="card"><h3>${esc(v.title)}</h3><p class="co">${esc(where(v))}</p>${badge(v.status)}
        ${["approved", "pending"].includes(v.status) ? `<div class="row-btns"><button class="btn line" data-close="${v.id}">${esc(T.close)}</button></div>` : ""}</article>`).join("");
    body.innerHTML = head + `<div class="price"><strong>${esc(e.company)}</strong><span>${esc(T.accessUntil(fmtDate(e.access_until)))}</span></div>
      ${resp ? `<h2 class="sec">${esc(T.empResponses)}</h2>${resp}` : ""}
      <h2 class="sec">${esc(T.candidates)}</h2>
      <div class="filter"><select id="jland"><option value="">${esc(T.allLands)}</option>${Object.keys(META.lands).map(c =>

      ${cands || `<div class="card"><p>${esc(T.noCand)}</p></div>`}
      ${vacs ? `<h2 class="sec">${esc(T.myVacs)}</h2>${vacs}` : ""}
      <h2 class="sec">${esc(T.newVac)}</h2>
      <form class="form big" id="vf" novalidate>
        ${field("v-title", T.vTitle, `<input id="v-title" maxlength="120" required>`)}
        ${field("v-land", T.land, `<select id="v-land">${opts(Object.keys(META.lands), JOBS.land || null, v => META.lands[v], true)}</select>`)}
        ${field("v-city", T.city, `<input id="v-city" maxlength="80" required>`)}
        <div class="field"><span class="lbl">${esc(T.level)}</span>${chips("vlevel", META.levels, null, v => v === "C1" ? L().c1 : v)}</div>
        <div class="field"><span class="lbl">${esc(T.employment)}</span>${chips("vemp", META.employment, "full", v => T.emp[v])}</div>
        ${field("v-salary", T.salary, `<input id="v-salary" maxlength="80">`)}
        ${field("v-desc", T.vDesc, `<textarea id="v-desc" maxlength="1500" required></textarea>`)}

    });
    body.querySelector("#vf").onsubmit = async (ev) => {
      ev.preventDefault();
      if (!validate(ev.target)) return;
      const v = (id) => $(id).value.trim() || null;
      const data = { title: v("v-title"), land: v("v-land"), city: v("v-city"), german_level: pickVal(body, "vlevel"),
        employment: pickVal(body, "vemp") || "full", salary: v("v-salary"), description: v("v-desc") };
      try { await japi("/api/jobs/vacancies", { method: "POST", body: JSON.stringify(data) }); toast(T.sentForReview); loadJobs(); }
      catch (er) { jerr(er); }
    };
    return;
  }
  const ef = body.querySelector("#ef");
  if (ef) ef.onsubmit = async (ev) => {
    ev.preventDefault();
    if (!validate(ev.target)) return;
    const v = (id) => $(id).value.trim() || null;
    const data = { company: v("e-company"), address: v("e-address"), register_no: v("e-reg"),
      contact_person: v("e-person"), contact: v("e-contact"), website: v("e-web") };
    try { await japi("/api/jobs/employer", { method: "PUT", body: JSON.stringify(data) }); toast(T.sentForReview); loadJobs(); }
    catch (er) { jerr(er); }
  };
}

const HL = () => H[lang] || H.uk;
let HOUSING = { data: null, tab: "terms" };

async function loadHousing() {
  try { HOUSING.data = await api("/api/housing"); HOUSING.failed = false; } catch { HOUSING.failed = true; }
  renderHousing();
}

function renderHousing() {
  const root = $("page-housing"); if (!root) return;
  const T = HL();
  root.innerHTML = `<div class="head"><h2>${esc(T.title)}</h2></div>
    <div class="seg">${Object.entries(T.tabs).map(([k, v]) => `<button data-t="${k}" aria-pressed="${HOUSING.tab === k}">${esc(v)}</button>`).join("")}</div>
    <div class="jpanel" id="hpanel"></div>`;
  root.querySelectorAll(".seg button").forEach(b => b.onclick = () => { HOUSING.tab = b.dataset.t; renderHousing(); });
  if (!HOUSING.data) { if (HOUSING.failed) failed($("hpanel"), loadHousing); else $("hpanel").innerHTML = skeleton(); return; }
  ({ terms: hTerms, docs: hDocs, calc: hCalc, letter: hLetter })[HOUSING.tab]($("hpanel"));
}

function hSources() {
  const d = HOUSING.data;
  return `<div class="items"><div class="item"><p class="meta">${esc(HL().checked(fmtDate(d.checked)))}</p>
    <ul class="links">${d.sources.map(s => `<li><a href="${esc(s.url)}" data-ext><span class="name">${esc(s.title)}</span><span class="meta">${esc(host(s.url))}</span></a></li>`).join("")}</ul></div></div>`;
}

function hTerms(panel) {
  panel.innerHTML = `<div class="items">${HOUSING.data.terms.map(x =>
    `<div class="item"><h3>${esc(x.de)}</h3><p class="text">${esc(x[lang] || x.uk)}</p></div>`).join("")}</div>` + hSources();
  bindLinks(panel);
}

function hDocs(panel) {
  const d = HOUSING.data;
  const li = (a) => a.map(x => `<div class="item"><p class="text" style="margin:0">${esc(x)}</p></div>`).join("");
  panel.innerHTML = `<div class="items">${li(d.checklist[lang] || d.checklist.uk)}</div>
    <div class="head"><p><strong>${esc(HL().safety)}</strong></p></div><div class="items">${li(d.safety[lang] || d.safety.uk)}</div>`;
}

function hCalc(panel) {
  const T = HL();
  const num = (id, label, val) => `<div class="field"><label for="${id}">${esc(label)}</label><input id="${id}" type="number" inputmode="decimal" min="0" step="1" value="${val}"></div>`;
  panel.innerHTML = `<div class="head"><p>${esc(T.calcIntro)}</p></div>
    <form class="form" id="hc" onsubmit="return false">
      ${num("c-kalt", T.kalt, 500)}${num("c-neben", T.neben, 150)}
      <div class="field"><label for="c-km">${esc(T.kMonths)}</label><select id="c-km">${[3, 2, 1, 0].map(m => `<option value="${m}">${m}</option>`).join("")}</select></div>
      <label class="check"><input type="checkbox" id="c-rates" checked> ${esc(T.rates)}</label>
      ${num("c-makler", T.makler, 0)}${num("c-other", T.other, 300)}
    </form>
    <div class="items" id="c-out"></div><p class="hint" style="margin:10px 16px">${esc(T.calcNote)}</p>`;
  const eur = (n) => new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n);
  const calc = () => {
    const v = (id) => Math.max(0, parseFloat($(id).value.replace(",", ".")) || 0);
    const kalt = v("c-kalt"), warm = kalt + v("c-neben"), kaution = kalt * Math.min(3, +$("c-km").value);
    const rates = $("c-rates").checked, part = rates ? kaution / 3 : kaution;
    const atMove = warm + part + v("c-makler") + v("c-other");
    const m23 = warm + (rates ? kaution / 3 : 0);
    const row = (a, b, strong) => `<div class="item"><p class="meta" style="margin:0">${esc(a)}</p><h3>${strong ? `<strong>${esc(b)}</strong>` : esc(b)}</h3></div>`;
    $("c-out").innerHTML = row(T.warm, eur(warm)) + row(T.kaution, eur(kaution)) + row(T.atMove, eur(atMove), true) +
      row(T.m23, eur(m23)) + row(T.first3, eur(atMove + 2 * m23));
  };
  panel.querySelectorAll("input, select").forEach(i => i.oninput = calc);
  calc();
}

// German letter + same content in uk/ru so the user knows what they send.
function buildLetter(f) {
  const kidsDe = (n) => n === 1 ? "1 Kind" : `${n} Kinder`;
  let household;
  if (f.adults <= 1 && f.kids === 0) household = ["Ich würde allein einziehen.", { uk: "Я заїду сам(а).", ru: "Я въеду один (одна)." }];
  else if (f.adults <= 1) household = [f.kids === 1 ? "Ich würde zusammen mit meinem Kind einziehen." : `Ich würde zusammen mit meinen ${f.kids} Kindern einziehen.`,
    { uk: `Я заїду разом із дітьми: ${f.kids}.`, ru: `Я въеду вместе с детьми: ${f.kids}.` }];
  else household = [`Wir sind ${f.adults + f.kids} Personen: ${f.adults} Erwachsene${f.kids ? " und " + kidsDe(f.kids) : ""}.`,
    { uk: `Нас ${f.adults + f.kids}: дорослих ${f.adults}${f.kids ? ", дітей " + f.kids : ""}.`, ru: `Нас ${f.adults + f.kids}: взрослых ${f.adults}${f.kids ? ", детей " + f.kids : ""}.` }];
  const income = {
    job: [f.job ? `Ich arbeite als ${f.job}.` : "Ich bin berufstätig.", { uk: f.job ? `Я працюю: ${f.job}.` : "Я працюю.", ru: f.job ? `Я работаю: ${f.job}.` : "Я работаю." }],
    jobcenter: ["Die Kosten der Unterkunft werden voraussichtlich vom Jobcenter übernommen. Eine Bestätigung reiche ich gerne nach.",
      { uk: "Оренду, ймовірно, оплачуватиме Jobcenter. Підтвердження надішлю окремо.", ru: "Аренду, вероятно, будет оплачивать Jobcenter. Подтверждение пришлю отдельно." }],
    sozialamt: ["Die Kosten der Unterkunft werden voraussichtlich vom Sozialamt übernommen. Eine Bestätigung reiche ich gerne nach.",
      { uk: "Оренду, ймовірно, оплачуватиме Sozialamt. Підтвердження надішлю окремо.", ru: "Аренду, вероятно, будет оплачивать Sozialamt. Подтверждение пришлю отдельно." }],
    none: null,
  }[f.income];
  const lines = [
    ["Sehr geehrte Damen und Herren,", { uk: "Шановні пані та панове,", ru: "Уважаемые дамы и господа," }],
    [`mit großem Interesse habe ich Ihre Anzeige für die Wohnung ${f.object} gelesen und möchte mich hiermit um die Wohnung bewerben.`,
      { uk: `Я з цікавістю прочитав(ла) ваше оголошення про квартиру ${f.object} і хочу подати заявку.`, ru: `Я с интересом прочитал(а) ваше объявление о квартире ${f.object} и хочу подать заявку.` }],
    [`Mein Name ist ${f.name}. Ich komme aus der Ukraine${f.since ? ` und lebe seit ${f.since} in Deutschland` : ""}${f.city ? `, derzeit in ${f.city}` : ""}.`,
      { uk: `Мене звати ${f.name}. Я з України${f.since ? `, живу в Німеччині з ${f.since}` : ""}${f.city ? `, зараз у місті ${f.city}` : ""}.`,
        ru: `Меня зовут ${f.name}. Я из Украины${f.since ? `, живу в Германии с ${f.since}` : ""}${f.city ? `, сейчас в городе ${f.city}` : ""}.` }],
    household, ...(income ? [income] : []),
    ...(f.level ? [[`Ich spreche Deutsch auf dem Niveau ${f.level} und lerne weiter.`, { uk: `Я говорю німецькою на рівні ${f.level} і продовжую вчити.`, ru: `Я говорю по-немецки на уровне ${f.level} и продолжаю учить.` }]] : []),
    ...(f.moveIn ? [[`Ein Einzug wäre ab dem ${f.moveIn} möglich.`, { uk: `Можу заїхати з ${f.moveIn}.`, ru: `Могу въехать с ${f.moveIn}.` }]] : []),
    ["Alle nötigen Unterlagen sende ich Ihnen gerne zu. Über eine Einladung zur Besichtigung würde ich mich sehr freuen.",
      { uk: "Охоче надішлю всі потрібні документи. Буду радий(а) запрошенню на перегляд.", ru: "С радостью пришлю все нужные документы. Буду рад(а) приглашению на просмотр." }],
    [`Mit freundlichen Grüßen\n${f.name}${f.contact ? "\n" + f.contact : ""}`, { uk: `З повагою,\n${f.name}`, ru: `С уважением,\n${f.name}` }],
  ];
  return { de: lines.map(l => l[0]).join("\n\n"), tr: lines.map(l => l[1][lang] || l[1].uk).join("\n\n") };
}

function hLetter(panel) {
  const T = HL();
  const field = (id, label, control) => `<div class="field"><label for="${id}">${esc(label)}</label>${control}</div>`;
  const inp = (id, max, extra = "") => `<input id="${id}" maxlength="${max}" ${extra}>`;
  panel.innerHTML = `<div class="head"><p>${esc(T.letterIntro)}</p></div>
    <form class="form" id="hl" novalidate>
      ${field("l-name", T.name, inp("l-name", 80, 'autocomplete="name" required'))}
      ${field("l-object", T.object, inp("l-object", 120, "required"))}
      ${field("l-city", T.city, inp("l-city", 80, `value="${esc(ME?.city || "")}"`))}
      ${field("l-since", T.since, inp("l-since", 20))}
      ${field("l-adults", T.adults, `<select id="l-adults">${[1, 2, 3, 4, 5].map(n => `<option>${n}</option>`).join("")}</select>`)}
      ${field("l-kids", T.kids, `<select id="l-kids">${[0, 1, 2, 3, 4, 5].map(n => `<option>${n}</option>`).join("")}</select>`)}
      ${field("l-income", T.income, `<select id="l-income">${Object.entries(T.inc).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("")}</select>`)}
      ${field("l-job", T.jobTitle, inp("l-job", 60))}
      ${field("l-level", T.level, `<select id="l-level">${opts(META.levels, ME?.german_level, v => v === "C1" ? L().c1 : v, true)}</select>`)}
      ${field("l-move", T.moveIn, inp("l-move", 30))}
      ${field("l-contact", T.contact, inp("l-contact", 80))}
      <button class="btn wide" type="submit">${esc(T.make)}</button>
    </form><div id="l-out"></div>`;
  panel.querySelector("#hl").onsubmit = (e) => {
    e.preventDefault();
    if (!validate(e.target)) return;
    const v = (id) => $(id).value.trim();
    const f = { name: v("l-name"), object: v("l-object"), city: v("l-city"), since: v("l-since"), adults: +v("l-adults"),
      kids: +v("l-kids"), income: v("l-income"), job: v("l-job"), level: v("l-level"), moveIn: v("l-move"), contact: v("l-contact") };
    const out = buildLetter(f);
    $("l-out").innerHTML = `<div class="head"><p><strong>${esc(T.yourLetter)}</strong></p></div>
      <div class="items"><div class="item"><p class="text" id="l-de" style="margin:0">${esc(out.de)}</p>
      <button class="btn" id="l-copy">${esc(T.copy)}</button></div></div>
      <div class="head"><p>${esc(T.meaning)}</p></div><div class="items"><div class="item"><p class="text" style="margin:0">${esc(out.tr)}</p></div></div>`;
    $("l-copy").onclick = async () => {
      try { await navigator.clipboard.writeText(out.de); toast(T.copied); }
      catch { const r = document.createRange(); r.selectNodeContents($("l-de")); getSelection().removeAllRanges(); getSelection().addRange(r); }
    };
    $("l-out").scrollIntoView({ behavior: "smooth" });
  };
}

function renderAll(page = "home") {
  document.documentElement.lang = lang;
  renderSign();
  renderNav(); renderHome(); renderJobs(); renderHousing(); renderProfile(); renderInfo(); renderPrivacy();
  show(page);
}

// Telegram's stable viewport height, so layout does not jump while the sheet is dragged.
function syncHeight() {
  const h = tg?.viewportStableHeight;
  if (h) document.documentElement.style.setProperty("--app-h", h + "px");
}
syncHeight();
tg?.onEvent?.("viewportChanged", (e) => { if (!e || e.isStateStable) syncHeight(); });

async function init() {
  lang = tg?.initDataUnsafe?.user?.language_code === "ru" ? "ru" : "uk";
  try {
    [META, SOURCES] = await Promise.all([api("/api/meta"), api("/api/sources")]);
    if (tg?.initData) { ME = await api("/api/me"); if (ME.language) lang = ME.language; }
    renderAll(location.hash === "#housing" ? "housing" : location.hash === "#jobs" ? "jobs" : "home");
    loadJobs(); loadHousing();
  } catch {
    failed($("page-home"), init);
  }
}
init();
